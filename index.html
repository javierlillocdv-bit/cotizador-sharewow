/* ===================== Registro de cotizaciones ===================== */
const LS_COTS="sw-cots-v1";
let qview=false, qcache=null, qsearch="";
async function saveQuoteRec(rec){
  if(db){ try{ await api("saveQuote",{rec}); return true; }catch(e){ return false; } }
  try{ const L=JSON.parse(lsGet(LS_COTS)||"[]"); L.unshift(rec); lsSet(LS_COTS, JSON.stringify(L.slice(0,300))); return true; }catch(e){ return false; }
}
async function loadQuotes(){
  if(db){ try{ return (await api("quotes")).quotes||[]; }catch(e){ return null; } }
  try{ return JSON.parse(lsGet(LS_COTS)||"[]"); }catch(e){ return []; }
}
async function deleteQuoteRec(id){
  if(db){ await api("delQuote",{id}); }
  else { const L=JSON.parse(lsGet(LS_COTS)||"[]").filter(r=>r.id!==id); lsSet(LS_COTS, JSON.stringify(L)); }
}
const normTxt = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const fechaLarga = ms => new Date(ms).toLocaleDateString("es-CL",{day:"numeric",month:"long",year:"numeric"});
const fechaCorta = ms => new Date(ms).toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit",year:"numeric"});
function venceMs(rec){ return rec.creado + (Number(rec.vigencia)||30)*86400000; }
function infoFromRec(rec){
  return {numero:rec.numero, fecha:fechaLarga(rec.creado), validaHasta: rec.vigencia? fechaLarga(venceMs(rec)) : "",
    cliente:rec.cliente, contacto:rec.contacto, correo:rec.correo, notas:rec.notas, vendedor:rec.vendedor||""};
}
function pdfOf(rec){
  if(!window.jspdf || !window.jspdf.jsPDF) throw {code:"nolib"};
  const blob=buildPDF(infoFromRec(rec), {titulo:rec.titulo, lines:rec.lines, total:rec.total, cabina:rec.cabina});
  const name=`Cotizacion ${rec.cliente||"Sharewow"} ${rec.numero}.pdf`.replace(/[\\/:*?"<>|]/g,"");
  return {blob, name};
}
async function downloadRec(rec){
  const {blob, name} = pdfOf(rec);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
function blobToB64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.onerror=rej; fr.readAsDataURL(blob); }); }
async function emailRec(rec){
  if(!db) throw {code:"sin_google"};
  if(!rec.correo) throw {code:"sin_correo"};
  const {blob, name} = pdfOf(rec);
  const pdf = await blobToB64(blob);
  await api("email",{rec, pdf, filename:name, empresa:empresa()});
}
function mailErrMsg(e){
  const c=e&&e.code;
  if(c==="sin_google") return "El envío automático necesita la conexión con Google.";
  if(c==="sin_conexion") return "No hay internet para enviar el correo.";
  if(c==="correo_invalido") return "El correo del cliente no es válido.";
  if(c==="no_autorizado") return "La sesión venció: bloquea y vuelve a entrar con la clave.";
  return "No se pudo enviar el correo.";
}
function dlErrMsg(e){
  const c=e&&e.code;
  if(c==="nolib") return "No se pudo cargar el generador de PDF. Revisa la conexión y recarga la página.";
  if(c==="declined") return "Descarga cancelada.";
  if(c==="rate_limited") return "Espera un momento y vuelve a intentar.";
  return "No se pudo descargar el PDF.";
}
function mailBody(rec){
  const E=empresa(), L=[];
  L.push(`Hola ${rec.cliente||""},`.trim()); L.push("");
  L.push(`Te enviamos la cotización N° ${rec.numero} de Sharewow:`); L.push("");
  L.push(rec.titulo);
  rec.lines.forEach(l=>L.push(`${l.ind?"   + ":"- "}${l.d}: ${pdfMoney(l.v)}`));
  L.push(""); L.push(`TOTAL: ${pdfMoney(rec.total)}`); L.push("");
  if(rec.vigencia) L.push(`Esta cotización tiene una validez de ${rec.vigencia} días, hasta el ${fechaLarga(venceMs(rec))}.`);
  if(rec.notas) L.push(`Notas: ${rec.notas}`);
  L.push(""); L.push("Saludos,"); if(rec.vendedor) L.push(rec.vendedor); [E.razon,E.dir1,E.dir2,E.web,E.correo,E.telefono].filter(Boolean).forEach(x=>L.push(x));
  return L.join("\n");
}
function openMail(rec){
  const url=`mailto:${encodeURIComponent(rec.correo||"")}?subject=${encodeURIComponent("Cotización Sharewow N° "+rec.numero)}&body=${encodeURIComponent(mailBody(rec))}`;
  const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
}

function renderQuotes(){
  root.innerHTML = `
  <header class="top">
    <button class="btn icon" id="qBack" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>

  <main><div class="qwrap">

  };
  if(qcache) drawQuoteList();
  else loadQuotes().then(L=>{ if(!qview) return; if(L===null){ document.getElementById("qList").innerHTML=`<p class="empty">No se pudieron cargar las cotizaciones. Recarga la página.</p>`; return; } qcache=L; drawQuoteList(); });
}
function drawQuoteList(){
  const box=document.getElementById("qList"); if(!box) return;
  const words=normTxt(qsearch).split(/\s+/).filter(Boolean);
  const L=(qcache||[]).filter(r=>{ if(!words.length) return true; const hay=normTxt([r.cliente,r.contacto,r.correo,r.numero,r.vendedor].join(" ")); return words.every(w=>hay.includes(w)); });
  if(!qcache || !qcache.length){ box.innerHTML=`<p class="empty">Todavía no hay cotizaciones guardadas.<br>Se guardan solas al tocar <b>Generar cotización</b>.</p>`; return; }
  const now=Date.now();
  box.innerHTML = `<p class="small" style="margin:0 0 12px">${L.length} de ${qcache.length} cotizaci${qcache.length===1?"ón":"ones"}</p>` +
    (L.length ? L.map(r=>{ const vence=r.vigencia?venceMs(r):null, ok=vence==null||vence>=now;
      return `<div class="qcard">
        <div class="qtop"><b>${esc(r.cliente||"Sin nombre")}</b><span class="qtot">${pdfMoney(r.total)}</span></div>
        <div class="qmeta">${fechaCorta(r.creado)} · N° ${esc(r.numero)}${r.vendedor?" · Vendedor: "+esc(r.vendedor):""}</div>
        <div class="qmeta">${esc(r.titulo)}</div>
        ${r.contacto||r.correo?`<div class="qmeta">${esc([r.contacto,r.correo].filter(Boolean).join(" · "))}</div>`:""}
        ${vence!=null?`<div class="qbadge ${ok?"ok":"off"}">${ok?"Vigente hasta "+fechaCorta(vence):"Vencida el "+fechaCorta(vence)}</div>`:""}
        <div class="qbtns"><button class="btn primary" data-qdl="${esc(r.id)}">Descargar PDF</button>
          ${r.correo?`<button class="btn" data-qmail="${esc(r.id)}">Enviar por correo</button>`:""}
          <button class="btn qdel" data-qdel="${esc(r.id)}">Borrar</button></div></div>`; }).join("")
    : `<p class="empty">No hay cotizaciones con ese nombre.</p>`);
}

function tileHTML(t,i,n){
  const pic = imgs[t.id] ? `<img src="${imgs[t.id]}" alt="" decoding="sync">` : `<span class="ph">Img</span>`;
  const inner = `<div class="name">${esc(t.titulo||"Sin nombre")}</div><div class="pic">${pic}</div>

function countAll(t){ let n=0; walk(t.hijos||[],()=>n++); return n; }

/* ---------- Editor de un botón ---------- */
function resizeImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{
      let max=900, q=.85, out="";
      for(let tries=0;tries<6;tries++){
        const s=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        out = c.toDataURL("image/webp",q); if(!out.startsWith("data:image/webp")) out=c.toDataURL("image/png");
        if(out.length<180000) break;
        max=Math.round(max*.8); q=Math.max(.6,q-.08);
      }
      URL.revokeObjectURL(url); res(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej()};
    im.src=url;
  });
}

function openTileEditor(t){
  const isNew=!t;
  const d = t? {titulo:t.titulo,color:t.color||COLORS[0],ancho:!!t.ancho,tipo:t.tipo||"botones"} : {titulo:"",color:COLORS[0],ancho:false,tipo:"botones"};
  let newImg = t ? (imgs[t.id]||null) : null, imgChanged=false;
  const draw=()=>{
    dlgBody.innerHTML = `<h3>${isNew?"Nuevo botón":"Editar botón"}</h3>
      <label class="lbl" for="fTitle">Nombre</label>
      <input class="inp" id="fTitle" value="${esc(d.titulo)}" placeholder="Ej: Figuras en cabina">
      <span class="lbl">Color</span>
      <div class="swatches">${COLORS.map(c=>`<button class="sw" style="background:${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="${d.color===c}"></button>`).join("")}
        <input type="color" id="fColor" value="${esc(d.color)}" aria-label="Otro color"></div>
      <span class="lbl">Imagen</span>
      <div class="preview"><div class="thumb">${newImg?`<img src="${newImg}" alt="">`:"Sin imagen"}</div>
        <div class="col"><label class="btn" style="cursor:pointer">${newImg?"Cambiar imagen":"Subir imagen"}<input type="file" accept="image/*" id="fImg" class="hidden"></label>
        ${newImg?`<button class="danger-link" id="rmImg">Quitar imagen</button>`:""}</div></div>
      <span class="lbl">Tamaño</span>
      <div class="seg"><button data-w="0" aria-pressed="${!d.ancho}">Normal</button><button data-w="1" aria-pressed="${d.ancho}">Ancho completo</button></div>
      <span class="lbl">Al tocarlo muestra</span>
      <div class="seg"><button data-tp="botones" aria-pressed="${d.tipo==="botones"}">Más botones</button><button data-tp="medidas" aria-pressed="${d.tipo==="medidas"}">Medidas y precios</button><button data-tp="grupo" aria-pressed="${d.tipo==="grupo"}">Grupo</button><button data-tp="fijo" aria-pressed="${d.tipo==="fijo"}">Precio fijo</button></div>
      <div class="row-btns"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">${isNew?"Añadir":"Guardar"}</button></div>`;
    const ft=document.getElementById("fTitle"); ft.oninput=e=>d.titulo=e.target.value;
    dlgBody.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{d.color=b.dataset.c;draw();});
    document.getElementById("fColor").oninput=e=>{d.color=e.target.value;dlgBody.querySelectorAll("[data-c]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===d.color));};
    dlgBody.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{d.ancho=b.dataset.w==="1";draw();});
    dlgBody.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{d.tipo=b.dataset.tp;draw();});
    document.getElementById("fImg").onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      try{ newImg=await resizeImage(f); imgChanged=true; draw(); }catch(err){ toast("No se pudo leer esa imagen"); }
    };
    const rm=document.getElementById("rmImg"); if(rm) rm.onclick=()=>{newImg=null;imgChanged=true;draw();};
    document.getElementById("cancel").onclick=()=>dlg.close();
    document.getElementById("save").onclick=()=>{
      if(!d.titulo.trim()){ft.focus();ft.style.borderColor="var(--danger)";return;}
      let node=t;
      if(isNew){ node={id:uid(),titulo:"",color:"",ancho:false,img:false,hijos:[]}; current().list.push(node); }
      node.titulo=d.titulo.trim(); node.color=d.color; node.ancho=d.ancho;
      if(d.tipo==="medidas"){ node.tipo="medidas"; if(!node.medidas) node.medidas=STD_CM.map(cm=>({cm,precio:null})); if(!node.encabezado) node.encabezado="Centímetros"; }
      else if(d.tipo==="grupo"){ node.tipo="grupo"; if(!node.tallas) node.tallas=[9,12,15,18]; if(!node.maxPersonas) node.maxPersonas=10; if(!node.encabezado) node.encabezado="Centímetros"; if(!node.fuente) node.fuente="cab1"; }
      else if(d.tipo==="fijo"){ node.tipo="fijo"; if(node.cm==null) node.cm=6; }
      else node.tipo="botones";
      if(imgChanged){ if(newImg){saveImg(node.id,newImg);node.img=true;} else {deleteImg(node.id);node.img=false;} }
      saveMenu(); dlg.close(); renderApp(); toast(isNew?"Botón añadido":"Cambios guardados");
    };
  };
  draw(); dlg.showModal();
  if(isNew) setTimeout(()=>{const f=document.getElementById("fTitle"); if(f) f.focus();},50);
}

function openSettings(){
  dlgBody.innerHTML = `<h3>Ajustes</h3>
    <label class="lbl" for="sName">Nombre en la pantalla de inicio</label>
    <input class="inp" id="sName" value="${esc(menu.nombre)}">
    <span class="lbl">Datos que salen en la cotización PDF</span>
    ${[["razon","Razón social"],["dir1","Dirección"],["dir2","Local / mall"],["web","Página web"],["correo","Correo"],["telefono","Teléfono"],["vigencia","Vigencia (días)"]]
      .map(([k,ph])=>`<input class="inp" data-ek="${k}" value="${esc(empresa()[k]||"")}" placeholder="${esc(ph)}" style="margin-top:8px" aria-label="${esc(ph)}">`).join("")}
    <span class="lbl">Puntos clave (solo cotizaciones de cabina)</span>
    ${[["captura","Proceso de Captura"],["reserva","Reserva de Fecha"],["entrega","Disponibilidad de Entrega"]]
      .map(([k,ph])=>`<label class="small" style="display:block;margin-top:8px">${esc(ph)}</label><textarea class="inp" data-ek="${k}" rows="3" style="resize:vertical" aria-label="${esc(ph)}">${esc(empresa()[k]||"")}</textarea>`).join("")}
    <span class="lbl">Cambiar clave</span>
    <input class="inp" id="sOld" type="password" inputmode="numeric" placeholder="Clave actual" autocomplete="off">
    <input class="inp" id="sNew" type="password" inputmode="numeric" placeholder="Clave nueva (mínimo 4 números)" style="margin-top:8px" autocomplete="off">
    <p class="small" id="sMsg">Déjalo en blanco si no quieres cambiarla.</p>
    <div class="row-btns"><button class="btn" id="sCancel">Cancelar</button><button class="btn primary" id="sSave">Guardar</button></div>`;
  dlg.showModal();
  document.getElementById("sCancel").onclick=()=>dlg.close();
  document.getElementById("sSave").onclick=async ()=>{
    const name=document.getElementById("sName").value.trim();
    const o=document.getElementById("sOld").value, n=document.getElementById("sNew").value;
    const msg=document.getElementById("sMsg");
    if(o||n){
      if(!/^[0-9]{4,8}$/.test(n)){msg.style.color="var(--danger)";msg.textContent="La clave nueva debe tener de 4 a 8 números.";return;}
      const oldH = await sha(SALT_PREFIX+pin.salt+o);
      const salt=Math.random().toString(36).slice(2,12), newH=await sha(SALT_PREFIX+salt+n);
      if(db){
        try{ await api("setPin",{salt, hash:newH, anterior:oldH}); }
        catch(e){ msg.style.color="var(--danger)"; msg.textContent = e.code==="clave_incorrecta" ? "La clave actual no es correcta." : "No se pudo cambiar la clave. Revisa internet."; return; }
      } else if(oldH!==pin.hash){msg.style.color="var(--danger)";msg.textContent="La clave actual no es correcta.";return;}
      pin={salt,hash:newH}; TOKEN=newH; savePin();
      try{sessionStorage.setItem(SS_TOKEN,newH)}catch(e){} if(lsGet(LS_TOKEN)) lsSet(LS_TOKEN,newH);
      toast("Clave cambiada");
    }
    const E=empresa(); let ch=false; const st=Object.assign({}, menu.empresa||{});
    dlgBody.querySelectorAll("[data-ek]").forEach(i=>{ const v=i.value.trim(); if((E[i.dataset.ek]||"")!==v){ st[i.dataset.ek]=v; ch=true; } });
    if(ch) menu.empresa=st;
    if(name && name!==menu.nombre){menu.nombre=name; ch=true;}
    if(ch) saveMenu();
    dlg.close(); renderApp();
  };
}

/* ---------- Precio rápido: mantener apretado un producto ---------- */
const QP_HINT = `<p class="qp-hint">Mantén apretado un botón para ver medidas y precios al instante</p>`;
const qpDlg = document.getElementById("qp");
const qpBody = document.getElementById("qpBody");
const qpFmt = n => okP(n) ? money(n) : "Consultar";
const cmRow = cm => cmTxt(cm)+" cm";

function qpSolas(keys){ return keys.map(t=>({titulo:TABLA_TXT[t], filas: tbl("solas",t).map(r=>[cmRow(r.cm), r.precio])})); }
const qpNotaPos = ()=>`Arrodillado o en silla ×${cmTxt(P.mult.arrod)} · Sentadilla o en el suelo ×${cmTxt(P.mult.suelo)}`;
const qpNotaAcc = ()=>`Accesorios aparte: grande +${cmTxt(P.pct.grande)}% · chico +${cmTxt(P.pct.chicoSolas)}% del valor de la figura`;
function qpGrupoSecs(){
  const ts = P.grupo.tallas||[];
  return [{titulo:"Persona más alta", filas: ts.map(t=>[cmRow(t), priceAt("unidas","alto",t)])},
          {titulo:"Si todos miden hasta 1,40 m (persona más alta)", filas: ts.map(t=>[cmRow(t), priceAt("unidas","bajo",t)])}];
}
const qpNotaGrupo = ()=>"El más alto se cobra con la medida elegida; los demás en proporción a su estatura, subiendo a la medida siguiente.";
function qpMascota(razas){ return razas.map(k=>{ const cm=P.mascotaSola[k]||4; return {titulo:`${RAZA_TXT[k]} · ${cmTxt(cm)} cm`, filas: PPOS.map(pos=>[PPOS_TXT[pos], petPrice(cm,pos)])}; }); }

function qpProdSec(p, titulo){
  const bits=[]; if(p.estilos&&p.estilos.length) bits.push(`${p.estilos.length} estilo${p.estilos.length>1?"s":""}`); if(p.tipos&&p.tipos.length) bits.push(`${p.tipos.length} tipos`);
  return {titulo: titulo!=null ? titulo : p.nombre+(bits.length?" · "+bits.join(" · "):""), filas: prodMeds(p).map(m=>[cmRow(m.cm), m.precio])};
}
const qpNotaMods = ()=>`Sentado o hincado +${cmTxt(C.mods.sentado)}% · En el piso o cuclillas +${cmTxt(C.mods.piso)}%`;
const qpNotaCAcc = ()=>`Accesorios aparte: grande +${cmTxt(C.mods.grande)}% · chico +${cmTxt(C.mods.chico)}% del valor de la figura`;
function qpProdNotas(p){
  const n=[];
  if(p.tipos&&p.tipos.length) n.push(`Tipos: ${p.tipos.join(", ")}`);
  if(p.estilos&&p.estilos.length) n.push(`Estilos (todos al mismo precio): ${p.estilos.join(", ")}`);
  if(p.mods) n.push(qpNotaMods());
  if(prodAcc(p)) n.push(qpNotaCAcc()); else if(p.detalle) n.push(p.detalle);
  return n;
}
function qpCatNotas(k){
  const n=[]; if(k.productos.some(p=>p.mods)) n.push(qpNotaMods()+" (figuras de personas)");
  if(k.productos.some(p=>prodAcc(p))) n.push(qpNotaCAcc());
  return n;
}
function qpCabinaTodo(){
  const secs=[];
  qpSolas(["alto","bajo","bebe"]).forEach(x=>secs.push({grupo:"1 persona", ...x}));
  qpGrupoSecs().forEach(x=>secs.push({grupo:"Grupo", ...x}));
  qpMascota(["chica","mediana","grande","gato"]).forEach(x=>secs.push({grupo:"Mascota sola", ...x}));
  return {titulo:"Figuras en cabina", sub:"Lista de precios", secciones:secs, notas:[qpNotaPos(), qpNotaAcc(), qpNotaGrupo()]};
}
function qpCartoonTodo(){
  const secs=[]; C.cats.forEach(k=>k.productos.forEach(p=>secs.push({grupo:k.nombre, ...qpProdSec(p)})));
  return {titulo:"Figuras cartoon", sub:"Lista de precios", secciones:secs, notas:[qpNotaMods()+" (figuras de personas)", qpNotaCAcc()]};
}
function qpInfo(el){
  if(el.matches(".tile[data-open]")){
    let t=null; walk(menu.tiles, x=>{ if(x.id===el.dataset.open) t=x; });
    if(t && t.tipo==="cabina") return qpCabinaTodo();
    if(t && t.tipo==="cartoon") return qpCartoonTodo();
    return null;
  }
  const a=el.dataset.a, v=el.dataset.v;
  if(a==="start"){
    if(v==="sola") return {titulo:"1 persona", sub:"Figuras en cabina", secciones:qpSolas(["alto","bajo","bebe"]), notas:[qpNotaPos(), qpNotaAcc()]};
    if(v==="grupo") return {titulo:"Grupo", sub:"Figuras en cabina · figuras unidas", secciones:qpGrupoSecs(), notas:[qpNotaGrupo(), qpNotaPos(), qpNotaAcc()]};
    if(v==="mascota") return {titulo:"Mascota sola", sub:"Figuras en cabina", secciones:qpMascota(["chica","mediana","grande","gato"]), notas:[]};
  }
  if(a==="tabla" && TABLA_TXT[v]) return {titulo:TABLA_TXT[v], sub:"1 persona · Figuras en cabina", secciones:qpSolas([v]).map(x=>({...x, titulo:""})), notas: v==="bebe"?[qpNotaAcc()]:[qpNotaPos(), qpNotaAcc()]};
  if(a==="raza" && RAZA_TXT[v]) return {titulo:RAZA_TXT[v], sub:"Mascota sola · Figuras en cabina", secciones:qpMascota([v]), notas:[]};
  if(a==="mpos" && cab.q && cab.q.raza) return {titulo:RAZA_TXT[cab.q.raza], sub:"Mascota sola · Figuras en cabina", secciones:qpMascota([cab.q.raza]), notas:[]};
  if(a==="cat"){ const k=C.cats.find(x=>x.id===v); if(!k) return null;
    return {titulo:k.nombre, sub:`Figuras cartoon · ${k.productos.length} opci${k.productos.length===1?"ón":"ones"}`, secciones:k.productos.map(p=>qpProdSec(p)), notas:qpCatNotas(k)}; }
  if(a==="prod"){ const k=ctCat(), p=k&&k.productos.find(x=>x.id===v); if(!p) return null;
    return {titulo:p.nombre, sub:k.nombre, secciones:[qpProdSec(p,"")], notas:qpProdNotas(p)}; }
  if(a==="ctipo"||a==="cest"){ const k=ctCat(), p=ctProd(); if(!p) return null;
    const extra = a==="cest" ? (ct.tipo?ct.tipo+" · ":"")+"estilo "+v : v;
    return {titulo:p.nombre, sub:`${k.nombre} · ${extra}`, secciones:[qpProdSec(p,"")], notas:qpProdNotas(p)}; }
  return null;
}
function qpHTML(info){
  let last=null;
  const secs = info.secciones.map(sc=>{
    const g = sc.grupo && sc.grupo!==last ? `<div class="qp-grp">${esc(sc.grupo)}</div>` : ""; if(sc.grupo) last=sc.grupo;
    return `${g}<div class="qp-sec">${sc.titulo?`<div class="qp-st">${esc(sc.titulo)}</div>`:""}
      <div class="qp-grid">${sc.filas.map(([a,pr])=>`<div class="qp-cell"><span class="qp-cm">${esc(a)}</span><span class="qp-pr">${esc(qpFmt(pr))}</span></div>`).join("")}</div></div>`;
  }).join("");
  return `<div class="qp-head">${info.img?`<img class="qp-thumb" src="${esc(info.img)}" alt="">`:""}
      <div class="qp-ht"><div class="qp-kicker">⚡ Precio rápido</div><h3>${esc(info.titulo)}</h3>${info.sub?`<div class="qp-sub">${esc(info.sub)}</div>`:""}</div>
      <button class="qp-x" id="qpX" aria-label="Cerrar">×</button></div>
    <div class="qp-body">${secs}${info.notas&&info.notas.length?`<ul class="qp-notes">${info.notas.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}</div>
    <div class="qp-foot"><button class="btn" id="qpCopy">Copiar precios</button><button class="btn primary" id="qpGo">Cotizar</button></div>`;
}
function qpText(info){
  const L=[info.titulo+(info.sub?" ("+info.sub+")":"")]; let last=null;
  info.secciones.forEach(sc=>{
    if(sc.grupo && sc.grupo!==last){ L.push("", sc.grupo.toUpperCase()); last=sc.grupo; }
    L.push(""); if(sc.titulo) L.push(sc.titulo+":");
    sc.filas.forEach(([a,pr])=>L.push(`${a}: ${qpFmt(pr)}`));
  });
  if(info.notas&&info.notas.length){ L.push(""); info.notas.forEach(n=>L.push("• "+n)); }
  return L.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}
let qpOpenedAt=0;
function openQP(info, el){
  const im = el.querySelector("img"); if(im) info.img = im.getAttribute("src");
  qpBody.innerHTML = qpHTML(info); hydrateImgs(qpBody);
  document.getElementById("qpX").onclick = ()=>qpDlg.close();
  document.getElementById("qpCopy").onclick = async ()=>{
    const t = qpText(info);
    try{ await navigator.clipboard.writeText(t); toast("Precios copiados"); return; }catch(e){}
    try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; qpDlg.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Precios copiados"); }catch(e){ toast("No se pudo copiar"); }
  };
  document.getElementById("qpGo").onclick = ()=>{ qpDlg.close(); qpFired=false; if(el.isConnected) el.click(); };
  qpOpenedAt = Date.now();
  try{ qpDlg.showModal(); }catch(e){ qpDlg.setAttribute("open",""); }
  const b = qpDlg.querySelector(".qp-body"); if(b) b.scrollTop = 0;
}
qpDlg.addEventListener("click", e=>{ if(e.target===qpDlg && Date.now()-qpOpenedAt>600) qpDlg.close(); });

const QP_SEL = ".tile[data-open], button.choice2[data-a]";
let qpTimer=null, qpEl=null, qpXY=null, qpFired=false;
function qpCancel(){ clearTimeout(qpTimer); qpTimer=null; if(qpEl) qpEl.classList.remove("qp-press"); qpEl=null; }
root.addEventListener("pointerdown", e=>{
  qpFired=false;
  if(editing || (e.pointerType==="mouse" && e.button!==0)) return;
  const el = e.target.closest(QP_SEL); if(!el || !root.contains(el)) return;
  const info = qpInfo(el); if(!info) return;
  qpCancel(); qpEl=el; qpXY=[e.clientX,e.clientY]; el.classList.add("qp-press");
  qpTimer = setTimeout(()=>{ const t=qpEl; qpCancel(); if(!t) return; qpFired=true; openQP(info, t); }, 480);
});
root.addEventListener("pointermove", e=>{ if(qpEl && qpXY && Math.hypot(e.clientX-qpXY[0], e.clientY-qpXY[1])>12) qpCancel(); });
root.addEventListener("pointerup", ()=>{ qpCancel(); if(qpFired) setTimeout(()=>{ qpFired=false; }, 600); });
root.addEventListener("pointercancel", qpCancel);
root.addEventListener("click", e=>{ if(qpFired){ qpFired=false; e.preventDefault(); e.stopPropagation(); } }, true);
root.addEventListener("contextmenu", e=>{
  const el = e.target.closest(QP_SEL); if(!el || !root.contains(el) || editing) return;
  e.preventDefault();
  if(qpDlg.open) return;
  const info = qpInfo(el); if(info){ qpCancel(); qpFired=true; openQP(info, el); setTimeout(()=>{ qpFired=false; }, 600); }
});

dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });

(async ()=>{
  await loadAll();
  if(await isUnlocked()) enterApp(); else showLock();
})();
})();
