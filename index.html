<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharewow</title>
<meta name="apple-mobile-web-app-title" content="Sharewow">
<meta name="application-name" content="Sharewow">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3BB33E">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#16171D;--muted:#62657A;--line:#DCE3DD;
  --green:#3BB33E;--green-dark:#2B8F2F;--green-ink:#FFFFFF;--frog:#E6F6E7;--frog-eye:#FFFFFF;--deco:#3BB33E;--head-bg:rgba(255,255,255,.86);
  --tile:#0A0B13;--tile-box:#000000;--tile-ink:#FFFFFF;
  --accent:#3B5BFF;--accent-ink:#FFFFFF;--danger:#D2335F;--ok:#14966F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512;--surface:#1A221D;--ink:#F1F4F2;--muted:#A3B0A7;--line:#2C3A30;
    --green:#4CC94F;--green-dark:#3BB33E;--green-ink:#0B130D;--frog:#16261A;--frog-eye:#0F1512;--deco:#3BB33E;--head-bg:rgba(15,21,18,.86);
    --accent:#7A90FF;--accent-ink:#0B0C14;--danger:#FF7A9C;--ok:#3CD3AE;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512;--surface:#1A221D;--ink:#F1F4F2;--muted:#A3B0A7;--line:#2C3A30;
  --green:#4CC94F;--green-dark:#3BB33E;--green-ink:#0B130D;--frog:#16261A;--frog-eye:#0F1512;--deco:#3BB33E;--head-bg:rgba(15,21,18,.86);
  --accent:#7A90FF;--accent-ink:#0B0C14;--danger:#FF7A9C;--ok:#3CD3AE;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:0 0 18px 18px;
  display:flex;align-items:center;gap:10px;padding:14px 20px;max-width:1200px;margin:0 auto}
.top h1{flex:1;margin:0;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:30px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles{flex:1;min-width:0}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;font-size:15px;white-space:nowrap}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon{width:44px;height:44px;padding:0;display:grid;place-items:center;border-radius:50%}
.icon svg{width:22px;height:22px}

main{max-width:1500px;margin:0 auto;padding:6px 28px 60px}
.banner{background:#FFE7A3;color:#3A2E00;border-radius:14px;padding:10px 14px;font-size:15px;margin-bottom:16px}

/* Botones grandes (como el diseño) */
.grid{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:clamp(18px,2.6vw,36px);margin-top:clamp(6px,2vh,24px)}
.grid.one{max-width:720px;margin-left:auto;margin-right:auto}
@media (max-width:1100px){.grid{grid-template-columns:repeat(var(--n2,2),minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.tile{position:relative;background:var(--tile);color:var(--tile-ink);border-radius:clamp(22px,2.4vw,34px);padding:clamp(16px,1.8vw,26px);
  aspect-ratio:1.13/1;display:flex;flex-direction:column;border:0;text-align:center;overflow:hidden}
.tile.wide{grid-column:1/-1;aspect-ratio:auto;min-height:260px}
.tile .name{background:var(--tile-box);border-radius:18px;padding:18px 14px;
  font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:500;font-size:clamp(32px,5vw,72px);line-height:1.05}
.tile .pic{flex:1;display:grid;place-items:center;padding:18px 8px 8px;min-height:0}
.tile .pic{position:relative}
.tile .pic img{position:absolute;left:0;right:0;top:16px;bottom:0;width:100%;height:calc(100% - 16px);object-fit:cover;object-position:center 25%;border-radius:16px}
.tile .ph{background:var(--tile-box);border-radius:16px;padding:clamp(22px,3vw,40px) clamp(26px,3.6vw,52px);
  font-family:"Barlow Condensed",Barlow,sans-serif;font-size:clamp(28px,4vw,60px);opacity:.9}
button.tile:active{transform:scale(.99)}
.tile .tools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;justify-content:center}
.tile .tools button{border:0;border-radius:12px;background:rgba(255,255,255,.95);color:#111;font-weight:700;font-size:15px;padding:10px 12px;min-width:44px}
.tile .tools .x{color:#C21F4E}
.editing .tile{outline:2px dashed rgba(255,255,255,.35);outline-offset:-8px}
.add-tile{border:2.5px dashed var(--line);background:transparent;border-radius:22px;aspect-ratio:1.13/1;
  font-family:"Barlow Condensed",Barlow,sans-serif;font-size:32px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:18px}

/* Pantalla de clave */
.lock{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:20px}
.lock-card{width:100%;max-width:380px;text-align:center}
.prep-bar{height:12px;border-radius:99px;background:#e6efe6;overflow:hidden;margin:14px 0 10px}.prep-bar span{display:block;height:100%;width:0;background:var(--green,#3BB33E);border-radius:99px;transition:width .15s}
.lock h2{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:44px;font-weight:700;margin:0 0 4px}
.lock p{color:var(--muted);margin:0 0 20px}
.dots{display:flex;justify-content:center;gap:14px;margin-bottom:22px;min-height:20px}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.dots span.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:68px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:28px;font-weight:600}
.pad button:active{background:var(--line)}
.pad .sm{font-size:16px}
.err{color:var(--danger);min-height:24px;margin-top:12px;font-weight:600}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px;color:var(--muted);font-size:15px}
.remember input{width:20px;height:20px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Ventana de edición */
dialog{border:0;border-radius:24px;padding:0;max-height:calc(100vh - 40px);overflow:auto;width:min(520px,calc(100vw - 24px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,11,19,.55)}
.dlg{padding:22px}
.dlg h3{margin:0 0 16px;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:30px;font-weight:700}
.lbl{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;font-size:17px}
.inp:focus{border-color:var(--accent);outline:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.swatches input[type=color]{width:44px;height:40px;border:0;background:none;padding:0}
.preview{display:flex;gap:12px;align-items:center}
.preview .thumb{width:84px;height:84px;border-radius:14px;background:var(--tile);display:grid;place-items:center;overflow:hidden;color:#fff;font-size:14px;flex:none}
.preview .thumb img{width:100%;height:100%;object-fit:contain}
.preview .col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg{flex-wrap:wrap}.seg button{flex:1 1 40%;border:0;background:transparent;border-radius:10px;padding:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.row-btns{display:flex;gap:10px;margin-top:22px}
.row-btns .btn{flex:1;padding:13px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.danger-link{border:0;background:none;color:var(--danger);font-weight:600;padding:8px 0;margin-top:10px}
.small{font-size:14px;color:var(--muted);margin:6px 0 0}

.med{max-width:1300px;margin:10px auto 0;text-align:center}
.pillhead{display:inline-block;background:var(--tile);color:var(--tile-ink);border-radius:999px;padding:16px 56px;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;font-size:clamp(36px,6vw,64px);line-height:1;margin-bottom:34px;letter-spacing:.02em}
.ovals{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.oval{border:0;border-radius:999px;background:var(--tile);color:var(--tile-ink);padding:22px 8px;font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;font-size:clamp(40px,6vw,64px);line-height:1}
.oval:active{transform:scale(.97)}
.result{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;border:0;background:transparent;width:100%}
.result .rcm{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:clamp(80px,16vw,180px);line-height:1;letter-spacing:.02em}
.result .rprice{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;font-size:clamp(64px,13vw,150px);line-height:1.05;margin-top:10px}
.result .rnone{font-size:22px;color:var(--muted);margin-top:16px}
.result .rback{font-size:16px;color:var(--muted);margin-top:28px}
.med-edit{max-width:560px;margin:0 auto}
.med-row{display:grid;grid-template-columns:1fr 1.6fr 64px 44px;gap:10px;margin-bottom:10px;align-items:center}
.med-row.head{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px}
.vis{display:flex;justify-content:center}.vis input{width:24px;height:24px}
.del-x{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--danger);font-size:24px}
.add-line{border:0;background:none;color:var(--accent);font-weight:700;padding:10px 0;font-size:16px}
@media (max-width:640px){.ovals{gap:12px}.pillhead{padding:14px 34px;margin-bottom:24px}}
.ovals.five{grid-template-columns:repeat(5,1fr)}
.plbl{text-align:left;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:clamp(34px,5vw,56px);font-weight:600;margin:0 0 18px}
.hlist{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hrow{display:flex;align-items:center;gap:14px}
.hn{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:36px;font-weight:600;width:56px;text-align:right}
.hin{flex:1;min-width:0;border:2px solid var(--tile);background:var(--surface);border-radius:999px;padding:14px 22px;text-align:center;
  font-family:"Barlow Condensed",Barlow,sans-serif;font-size:34px;font-weight:600}
.hin:focus{outline:none;border-color:var(--accent)}
.gen{display:block;margin:30px auto 0;border:0;border-radius:999px;background:var(--tile);color:var(--tile-ink);padding:22px 80px;
  font-family:"Barlow Condensed",Barlow,sans-serif;font-size:clamp(40px,6vw,58px);font-weight:600;line-height:1}
.breakdown{max-width:640px;margin:0 auto;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:6px 16px;text-align:left}
.brow{display:grid;grid-template-columns:32px 70px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.brow:last-child{border-bottom:0}
.bn{font-weight:700;color:var(--muted)}
.bp{font-weight:700}
.total-lbl{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:clamp(36px,5vw,56px);font-weight:600;margin-top:28px}
.total-box{display:inline-block;border:3px solid var(--ink);border-radius:18px;padding:12px 40px;margin-top:8px;
  font-family:"Barlow Condensed",Barlow,sans-serif;font-size:clamp(64px,12vw,130px);font-weight:600;line-height:1.05}
.warn-txt{color:var(--danger);font-weight:600;min-height:1em;margin:14px 0 0}
@media (max-width:640px){.ovals.five{grid-template-columns:repeat(5,1fr);gap:8px}.ovals.five .oval{font-size:32px;padding:16px 4px}.brow{grid-template-columns:24px 60px 1fr auto;font-size:14px}.gen{padding:18px 56px}}
.pblock{border-bottom:1px solid var(--line);padding:4px 0 10px}
.pblock:last-child{border-bottom:0}
.pblock .brow{border-bottom:0}
.accline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding-left:42px;font-size:15px;color:var(--muted)}
.accline b{color:var(--ink)}
.accbtn{border:1.5px solid var(--tile);background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.acclist{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.accitem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;text-align:left}
.accitem.on{border-color:var(--tile);box-shadow:inset 0 0 0 1.5px var(--tile)}
.accitem .an{flex:1;min-width:0;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:30px;font-weight:600;line-height:1.1}
.accitem .ap{color:var(--muted);font-size:16px;font-family:Barlow,sans-serif;font-weight:500;display:block}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:48px;height:48px;border-radius:50%;border:0;background:var(--tile);color:var(--tile-ink);font-size:26px;font-weight:700;line-height:1}
.qty button:disabled{opacity:.3}
.qty span{min-width:28px;text-align:center;font-size:26px;font-weight:700}
.accsum{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:34px;font-weight:600;margin-top:22px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(16px,2.4vw,32px);max-width:1300px;margin:0 auto}
.choice2{background:var(--tile);color:var(--tile-ink);border:0;border-radius:28px;padding:clamp(30px,4vw,52px) 22px;min-height:clamp(170px,24vw,320px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.choice2 .t{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;font-size:clamp(32px,4.4vw,60px);line-height:1.05}
.choice2 .s{font-size:clamp(16px,1.6vw,21px);opacity:.8}
.choice2:active{transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.chip{border:1.5px solid var(--tile);background:transparent;color:var(--ink);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--tile);color:var(--tile-ink)}
.sumcard{max-width:680px;margin:0 auto 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:14px 18px;text-align:left}
.sl{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:6px 0;font-size:17px}
.sl.sub{font-size:15px;color:var(--muted);padding:2px 0}
.sumcard .pblock{padding:10px 0}
.sumcard .accline{padding-left:0}
.petrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:4px 0}
.ed-wrap{max-width:760px;margin:0 auto}
.note-ed{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.ed-sec{font-family:"Barlow Condensed",Barlow,sans-serif;font-size:30px;margin:26px 0 10px}
.card-ed{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.card-ed h4{margin:0 0 10px;font-size:18px}
.ed-row{display:grid;gap:8px;align-items:center;margin-bottom:8px}
.ed-row.head{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.ed-row .inp{padding:10px;font-size:16px;min-width:0}
.ed-f{display:grid;grid-template-columns:1fr 160px;gap:10px;align-items:center;margin-bottom:8px;font-size:16px}
@media (max-width:640px){.ed-f{grid-template-columns:1fr 110px}.ed-row .inp{padding:8px 6px;font-size:15px}}
.choice2 .ci{display:block;width:100%;height:clamp(140px,20vw,300px);margin:8px 0 2px}
.choice2 .ci img{width:100%;height:100%;object-fit:contain;border-radius:14px}
.camrow{display:flex;gap:8px;justify-content:center;margin-top:10px}
.camb{background:rgba(255,255,255,.95);color:#111;border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700;cursor:pointer}
.camb.x{color:#C21F4E}
/* Fondo con líneas y rana */
.bgdeco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgdeco svg{position:absolute}
.bgdeco .tl{top:0;left:0;width:min(42vw,380px);height:auto}

#root{position:relative;z-index:1}
/* Botones verdes */
.oval{background:var(--green);color:var(--green-ink)}
.gen{background:var(--green);color:var(--green-ink)}
.btn.primary,.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.chip{border-color:var(--green-dark)}
.accbtn{border-color:var(--green);color:var(--green-dark)}
.qty button{background:var(--green);color:var(--green-ink)}
.accitem.on{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.round{background:var(--frog);color:var(--green-dark)}
.add-line{color:var(--green-dark)}
.seg button[aria-pressed="true"]{color:var(--green-dark)}
.total-box{border-color:var(--green)}
.dots span.f{background:var(--green);border-color:var(--green)}
.pad button:active{background:var(--frog)}
.qwrap{max-width:820px;margin:0 auto}
.qsearch{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--green);border-radius:999px;padding:6px 18px;margin-bottom:18px}
.qsearch svg{width:22px;height:22px;color:var(--green-dark);flex:none}
.qsearch input{flex:1;min-width:0;border:0;background:transparent;font-size:19px;padding:10px 0;outline:none}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px}
.qtop{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:20px}
.qtot{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:26px}
.qmeta{color:var(--muted);font-size:15px;margin-top:2px}
.qbadge{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px}
.qbadge.ok{background:var(--frog);color:var(--green-dark)}
.qbadge.off{background:#FDE3EA;color:#B0244F}
.qbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qbtns .btn{padding:10px 16px}
.qdel{color:var(--danger)}
/* Cuadros de inicio: etiqueta verde arriba, imagen en todo el cuadro */
.tile{padding:0;display:block;overflow:hidden}
.tile .pic{position:absolute;inset:0;padding:0;display:grid;place-items:center}
.tile .pic img{position:absolute;inset:0;top:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:0}
.tile .name{position:absolute;z-index:2;top:clamp(14px,2vw,26px);left:50%;transform:translateX(-50%);
  background:var(--green);color:var(--green-ink);border-radius:999px;padding:clamp(10px,1.2vw,16px) clamp(24px,3vw,44px);
  font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;font-size:clamp(22px,2.8vw,40px);line-height:1.05;
  white-space:normal;width:max-content;max-width:calc(100% - 28px);text-align:center;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tile .tools{z-index:3}
/* Botones de adentro: nombre en verde arriba, imagen en todo el cuadro */
.choice2{position:relative;overflow:hidden;padding:0;min-height:0;aspect-ratio:1/1.02;display:block}
.choice2 .t{position:absolute;z-index:2;top:clamp(12px,1.8vw,22px);left:50%;transform:translateX(-50%);
  background:var(--green);color:var(--green-ink);border-radius:22px;padding:clamp(8px,.9vw,12px) clamp(16px,2vw,28px);
  font-size:clamp(20px,2.3vw,34px);line-height:1.08;width:max-content;max-width:calc(100% - 24px);text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.choice2 .ci{position:absolute;inset:0;width:100%;height:100%;margin:0}
.choice2 .ci img{width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:0}
.choice2 .s{position:absolute;z-index:2;bottom:clamp(12px,1.6vw,20px);left:50%;transform:translateX(-50%);
  background:rgba(10,11,19,.72);color:#fff;opacity:1;border-radius:999px;padding:7px 16px;width:max-content;max-width:calc(100% - 24px);text-align:center;font-size:clamp(15px,1.5vw,20px)}
.choice2 .camrow{position:absolute;z-index:3;left:0;right:0;top:50%;transform:translateY(-50%);margin:0}
/* Todos los cuadros del mismo tamaño: 3 por fila en iPad/computador */
.grid,.choices{--g:clamp(16px,2.2vw,30px);display:flex;flex-wrap:wrap;justify-content:center;gap:var(--g);max-width:1500px;margin-left:auto;margin-right:auto}
.grid > *,.choices > *{flex:0 0 calc((100% - 2*var(--g))/3);width:calc((100% - 2*var(--g))/3);aspect-ratio:1/1;min-height:0}
.grid > .tile.wide{flex-basis:100%;width:100%;aspect-ratio:auto;min-height:300px}
@media (max-width:1299px){.grid > *,.choices > *{flex-basis:calc((100% - var(--g))/2);width:calc((100% - var(--g))/2)}}
/* Cuadros de inicio: siempre 2 por fila, grandes */
.grid > *{flex:0 0 calc((100% - var(--g))/2);width:calc((100% - var(--g))/2);aspect-ratio:1.13/1}
.grid > .tile.wide{flex-basis:100%;width:100%;aspect-ratio:auto;min-height:300px}
@media (max-width:560px){.grid > *,.choices > *{flex-basis:100%;width:100%}}
.top{position:sticky}
.homebtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:8px;
  border:0;border-radius:999px;background:var(--green);color:var(--green-ink);font-weight:700;font-size:16px;padding:11px 20px;box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}
.homebtn svg{width:20px;height:20px}
.homebtn:active{transform:translate(-50%,-50%) scale(.97)}
@media (max-width:760px){.homebtn{position:static;transform:none;padding:10px 12px}.homebtn span{display:none}.homebtn:active{transform:scale(.97)}}
.ok-txt{color:var(--green-dark);font-weight:700;margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ok);color:#fff;padding:10px 20px;border-radius:999px;font-weight:700;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:640px){.grid{gap:16px}.top{padding:12px 14px}main{padding:4px 14px 50px}.top h1{font-size:26px}}
@media (prefers-reduced-motion: reduce){.shake{animation:none}.toast{transition:none}}
/* Precio rápido (mantener apretado) */
.choice2,.tile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.choice2 img,.tile img{pointer-events:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.qp-press{transform:scale(.96)!important;transition:transform .45s ease!important}
#qp{width:min(680px,calc(100vw - 24px));overflow:hidden}
#qp::backdrop{background:rgba(5,8,6,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.qp{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.qp-head{display:flex;gap:14px;align-items:center;padding:18px 16px 14px 18px;border-bottom:1px solid var(--line)}
.qp-thumb{width:64px;height:64px;border-radius:14px;object-fit:cover;object-position:center 30%;background:#fff;flex:none}
.qp-ht{flex:1;min-width:0}
.qp-kicker{color:var(--green);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.qp-ht h3{margin:2px 0 0;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:30px;font-weight:700;line-height:1.05}
.qp-sub{color:var(--muted);font-size:15px;margin-top:3px}
.qp-x{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);font-size:32px;line-height:1;flex:none;cursor:pointer}
.qp-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 10px;flex:1}
.qp-grp{margin:20px 0 0;font-family:"Barlow Condensed",Barlow,sans-serif;font-size:25px;font-weight:700;color:var(--green)}
.qp-sec{margin:14px 0 4px}
.qp-st{font-weight:700;font-size:16px;margin-bottom:8px}
.qp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.qp-cell{border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;gap:1px}
.qp-cm{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:22px;line-height:1.1}
.qp-pr{font-weight:700;color:var(--green-dark);font-size:17px}
.qp-notes{margin:16px 0 6px;padding-left:18px;color:var(--muted);font-size:14.5px;line-height:1.45}
.qp-notes li{margin:3px 0}
.qp-foot{display:flex;gap:10px;padding:14px 18px 18px;border-top:1px solid var(--line)}
.qp-foot .btn{flex:1;padding:13px 18px;font-size:17px}
.qp-hint{text-align:center;color:var(--muted);font-size:15px;margin:20px 0 0}
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const SALT_PREFIX = "sharewow-tienda";
const LS_MENU="sw-menu-v2", LS_IMG="sw-img-", LS_PIN="sw-pin-v1", LS_TOKEN="sw-unlock", SS_TOKEN="sw-unlock";
const COLORS = ["#0A0B13","#2B3A8F","#7A1F3D","#145C4A","#5B3A8C","#8A5A00"];

const DEFAULT_MENU = {
  nombre:"Sharewow",
  tiles:[
    {id:"cabina", titulo:"Figuras en cabina", tipo:"cabina", color:"#0A0B13", ancho:false, img:false, hijos:[]},
    {id:"cartoon", titulo:"Figuras cartoon", tipo:"cartoon", color:"#0A0B13", ancho:false, img:false, hijos:[]}
  ]
};

const STD_CM=[6,7,8,9,12,15,18,30];
const defaultMedidas = ()=>STD_CM.map(cm=>({cm, precio: cm===7?36000:null}));
let med = {sel:null, draft:null, acc:{}, accOpen:false};
let db=null, menu=null, pin=null; // pin = {salt, hash}
const imgs = {};               // id -> dataURL
let path = [];                 // ids de la ruta actual
let editing = false;
const root = document.getElementById("root");
const dlg = document.getElementById("dlg");
const dlgBody = document.getElementById("dlgBody");

const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),1700)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

async function sha(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ---------- Conexión con Google (Apps Script) ---------- */
const API_URL = (window.COTIZADOR_CONFIG && window.COTIZADOR_CONFIG.apiUrl) || "";
let TOKEN = null, BOOT = null;
async function api(action, payload){
  const body = JSON.stringify(Object.assign({action, token:TOKEN}, payload||{}));
  let r;
  try{ r = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body, redirect:"follow"}); }
  catch(e){ const er=new Error("sin_conexion"); er.code="sin_conexion"; throw er; }
  let j; try{ j = await r.json(); }catch(e){ const er=new Error("respuesta_invalida"); er.code="respuesta_invalida"; throw er; }
  if(!j.ok){ const er=new Error(j.error||"error"); er.code=j.error||"error"; throw er; }
  return j;
}

/* ---------- Datos: cuenta (Google) con respaldo local ---------- */
let writeChain = Promise.resolve();
function queueWrite(fn){ writeChain = writeChain.then(fn).catch(()=>toast("No se pudo guardar en tu cuenta")); return writeChain; }

let saveTimer=null;
function saveMenu(){
  lsSet(LS_MENU, JSON.stringify(menu));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ if(db) queueWrite(()=>api("setDoc",{key:"menu", data:menu})); }, 400);
}
function saveImg(id, src){
  imgs[id]=src;
  if(db) queueWrite(()=>api("img",{key:id, src}).then(r=>{ if(r&&r.url && !PRE.has(r.url)){ const im=new Image(); im.src=r.url; PRE.set(r.url, im); } }));
  else lsSet(LS_IMG+id, src);
}
function deleteImg(id){
  delete imgs[id];
  if(db) queueWrite(()=>api("imgDel",{key:id}));
  lsDel(LS_IMG+id);
}
function savePin(){ if(!db) lsSet(LS_PIN, JSON.stringify(pin)); }

/* Precarga: todas las fotos se descargan y quedan listas en memoria al abrir
   la página. Los botones usan esas mismas fotos ya listas, así nunca se ven cargando. */
const PRE = new Map(); let PRE_OK = 0, PRE_DONE = 0, PRE_TOTAL = 0; window.__fotosListas = ()=>PRE_OK;
const PRE_ORDEN = ["cabina","cartoon","x_cab_sola","x_cab_grupo","x_cab_mascota","x_ct_cat_","x_cab_alto","x_cab_bajo","x_cab_bebe","x_cab_raza_","x_ct_prod_","x_cab_mpos_","x_ct_est_"];
const preQ = []; let preActive = 0;
function preloadImgs(){
  const prio = k => { const i = PRE_ORDEN.findIndex(p => k===p || (p.endsWith("_") && k.startsWith(p))); return i<0 ? 99 : i; };
  Object.keys(imgs).sort((a,b)=>prio(a)-prio(b) || a.localeCompare(b)).map(k=>imgs[k])
    .filter(u=>u && !String(u).startsWith("data:") && !PRE.has(u))
    .forEach(u=>{ PRE.set(u, null); preQ.push(u); PRE_TOTAL++; });
  prePump();
}
function prePump(){
  while(preActive<6 && preQ.length){
    const u = preQ.shift(); preActive++;
    const im = new Image(); im.decoding = "sync";
    const fin = ok=>{ preActive--; PRE_DONE++; if(ok){ PRE_OK++; PRE.set(u, im); } prePump(); };
    im.onload = ()=>{ (im.decode ? im.decode().catch(()=>{}) : Promise.resolve()).then(()=>fin(true)); };
    im.onerror = ()=>fin(false);
    im.src = u;
  }
}
// Cambia cada foto nueva de la pantalla por la que ya está lista en memoria (antes de que se dibuje)
function hydrateImgs(scope){
  const list = scope.tagName==="IMG" ? [scope] : (scope.querySelectorAll ? scope.querySelectorAll("img") : []);
  list.forEach(img=>{
    if(img.dataset.pre) return;
    const p = PRE.get(img.getAttribute("src"));
    if(!p || !p.complete || !p.naturalWidth) return;
    const el = p.isConnected ? p.cloneNode(false) : p;
    el.alt = img.alt || ""; el.className = img.className;
    const st = img.getAttribute("style"); if(st) el.setAttribute("style", st); else el.removeAttribute("style");
    el.setAttribute("decoding","sync"); el.dataset.pre = "1";
    img.replaceWith(el);
  });
}
new MutationObserver(ms=>{ ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1) hydrateImgs(n); })); })
  .observe(root, {childList:true, subtree:true});
// Antes de mostrar los botones, espera a que todas las fotos estén listas
function waitFotos(maxMs){
  return new Promise(res=>{
    const t0 = Date.now(); let shown = false;
    const tick = ()=>{
      if(PRE_DONE>=PRE_TOTAL || Date.now()-t0>maxMs) return res();
      if(Date.now()-t0>400){
        const pct = PRE_TOTAL ? Math.round(PRE_DONE*100/PRE_TOTAL) : 0;
        if(!shown){ shown = true; root.innerHTML = `<div class="lock"><div class="lock-card"><h2>Preparando fotos</h2><p id="prepTxt"></p><div class="prep-bar"><span id="prepBar"></span></div><p class="small">Solo la primera vez en este equipo tarda unos segundos.</p></div></div>`; }
        const t = document.getElementById("prepTxt"), b = document.getElementById("prepBar");
        if(t) t.textContent = `${PRE_DONE} de ${PRE_TOTAL}`; if(b) b.style.width = pct+"%";
      }
      setTimeout(tick, 80);
    };
    tick();
  });
}
async function enterApp(){ await waitFotos(40000); renderApp(); }
function registerSW(){
  try{ if("serviceWorker" in navigator && location.protocol!=="file:"){
    navigator.serviceWorker.register("sw.js").then(r=>{ try{ r.update(); }catch(e){} }).catch(()=>{});
  } }catch(e){}
}

async function loadAll(){
  // Fotos guardadas como archivos en GitHub; se precargan de inmediato
  try{ const r=await fetch("img/index.json",{cache:"no-cache"}); if(r.ok){ const idx=await r.json(); Object.keys(idx).forEach(k=>{ imgs[k]=idx[k]; }); } }catch(e){}
  preloadImgs(); registerSW();
  if(API_URL){
    try{
      BOOT = await api("boot");
      db = {google:true};
      const cfg = BOOT.config||{};
      if(cfg.menu) menu = clone(cfg.menu);
      if(cfg.precios) P = clone(cfg.precios);
      if(cfg.cartoon) C = clone(cfg.cartoon);
      pin = BOOT.hayClave ? {salt:BOOT.salt} : null;
      Object.entries(BOOT.fotos||{}).forEach(([k,u])=>{ if(u) imgs[k]=u; else delete imgs[k]; });
      preloadImgs();
    }catch(e){ db=null; BOOT=null; }
  }
  if(!menu){ const raw=lsGet(LS_MENU); menu = raw? JSON.parse(raw) : clone(DEFAULT_MENU); }
  if(!pin){ const raw=lsGet(LS_PIN); if(raw) pin = JSON.parse(raw); }
  if(!db){ const raw=lsGet(LS_PRECIOS); if(raw){ try{ P=JSON.parse(raw); }catch(e){} } const rc=lsGet(LS_CARTOON); if(rc){ try{ C=JSON.parse(rc); }catch(e){} } }
  if(C && C.cats && !C.movAE){ C.cats.forEach(k=>(k.productos||[]).forEach(p=>{ if(p.id==="p21" && !(p.estilos&&p.estilos.length)) p.estilos=["A","B","C","D","E"]; })); C.movAE=true; }
  let changed=false;
  walk(menu.tiles, t=>{ if(t.id==="cab2" && !t.tipo){ t.tipo="grupo"; t.encabezado="Centímetros"; t.tallas=[9,12,15,18]; t.maxPersonas=10; t.fuente="cab1"; changed=true; } });
  walk(menu.tiles, t=>{ if(t.id==="cab1" && !t.tipo){ t.tipo="medidas"; t.encabezado="Centímetros"; t.medidas=defaultMedidas(); changed=true; } });
  if(changed) saveMenu();
  if(!db){ walk(menu.tiles, t=>{ if(t.img){ const s=lsGet(LS_IMG+t.id); if(s) imgs[t.id]=s; } });
    try{ for(let k=0;k<localStorage.length;k++){ const key=localStorage.key(k); if(key && key.startsWith(LS_IMG+"x_")){ imgs[key.slice(LS_IMG.length)]=localStorage.getItem(key); } } }catch(e){} }
}
function walk(list, fn){ list.forEach(t=>{fn(t); walk(t.hijos||[], fn);}); }

/* ---------- Clave ---------- */
async function isUnlocked(){
  if(!pin) return false;
  let tok=null; try{tok=sessionStorage.getItem(SS_TOKEN)}catch(e){} tok = tok || lsGet(LS_TOKEN);
  if(!tok) return false;
  if(!db) return tok === pin.hash;
  try{ const r = await api("login",{hash:tok}); if(r.valida){ TOKEN = tok; return true; } }catch(e){}
  return false;
}
function lockNow(){ qview=false; TOKEN=null; try{sessionStorage.removeItem(SS_TOKEN)}catch(e){} lsDel(LS_TOKEN); editing=false; path=[]; showLock(); }

function showLock(mode){
  // mode: "entrar" | "crear" | "confirmar"
  mode = mode || (pin ? "entrar" : "crear");
  let entered = "", first = showLock.first || "";
  const titles = {entrar:["Hola 👋","Escribe la clave para entrar"], crear:["Crea tu clave","Mínimo 4 números. La pedirá en cada equipo."], confirmar:["Repite la clave","Para confirmar que la escribiste bien"]};
  root.innerHTML = `<div class="lock"><div class="lock-card">
    <h2>${titles[mode][0]}</h2><p>${titles[mode][1]}</p>
    <div class="dots" id="dots"></div>
    <div class="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}
      <button class="sm" data-a="clear">Borrar</button><button data-n="0">0</button><button class="sm" data-a="ok">Entrar</button>
    </div>
    ${mode==="entrar"?`<label class="remember"><input type="checkbox" id="rem" ${lsGet(LS_TOKEN)?"checked":""}> Recordar en este equipo</label>`:""}
    <div class="err" id="err"></div>
    ${!db?`<p class="small">${API_URL?"No se pudo conectar con Google. Revisa internet y recarga la página.":"Sin conexión con Google: la clave y los cambios quedan solo en este equipo."}</p>`:""}
  </div></div>`;
  const dots = document.getElementById("dots"), err=document.getElementById("err");
  const draw = ()=>{ const n=Math.max(4,entered.length); dots.innerHTML = Array.from({length:n},(_,i)=>`<span class="${i<entered.length?"f":""}"></span>`).join(""); };
  const fail = m=>{ err.textContent=m; entered=""; draw(); const c=root.querySelector(".lock-card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); };
  const submit = async ()=>{
    if(entered.length<4) return fail("La clave tiene al menos 4 números");
    if(mode==="crear"){ showLock.first = entered; return showLock("confirmar"); }
    if(mode==="confirmar"){
      if(entered!==first){ showLock.first=""; return showLock("crear"), toast("No coincidían, prueba de nuevo"); }
      const salt = Math.random().toString(36).slice(2,12);
      const hash = await sha(SALT_PREFIX+salt+entered);
      if(db){ try{ await api("setPin",{salt, hash}); }catch(e){ showLock.first=""; return fail("No se pudo guardar la clave. Revisa internet."); } }
      pin = {salt, hash}; TOKEN = hash;
      savePin(); showLock.first="";
      try{sessionStorage.setItem(SS_TOKEN,hash)}catch(e){}
      toast("Clave creada"); return enterApp();
    }
    const h = await sha(SALT_PREFIX+pin.salt+entered);
    if(db){
      let ok=false; try{ ok = (await api("login",{hash:h})).valida; }catch(e){ return fail("No se pudo conectar. Revisa internet."); }
      if(!ok) return fail("Clave incorrecta");
      TOKEN = h;
    } else if(h!==pin.hash) return fail("Clave incorrecta");
    try{sessionStorage.setItem(SS_TOKEN,h)}catch(e){}
    const rem=document.getElementById("rem"); if(rem&&rem.checked) lsSet(LS_TOKEN,h); else lsDel(LS_TOKEN);
    enterApp();
  };
  root.querySelectorAll("[data-n]").forEach(b=>b.addEventListener("click",()=>{ if(entered.length<8){entered+=b.dataset.n;err.textContent="";draw();} }));
  root.querySelector('[data-a="clear"]').addEventListener("click",()=>{entered=entered.slice(0,-1);draw();});
  root.querySelector('[data-a="ok"]').addEventListener("click",submit);
  document.onkeydown = e=>{
    if(!root.querySelector(".pad")) return;
    if(/^[0-9]$/.test(e.key) && entered.length<8){entered+=e.key;err.textContent="";draw();}
    else if(e.key==="Backspace"){entered=entered.slice(0,-1);draw();}
    else if(e.key==="Enter"){submit();}
  };
  draw();
}

/* ---------- Navegación por niveles ---------- */
function current(){
  let list = menu.tiles, node=null; const names=[menu.nombre];
  for(const id of path){ node = list.find(t=>t.id===id); if(!node){ path=[]; return {list:menu.tiles,node:null,names:[menu.nombre]}; } list = node.hijos = node.hijos||[]; names.push(node.titulo); }
  return {list,node,names};
}

function renderApp(){
  root.onclick = null;
  if(qview){ renderQuotes(); return; }
  document.onkeydown = null;
  const {list,node,names} = current();
  const isMed = !!(node && node.tipo==="medidas");
  const isGrp = !!(node && node.tipo==="grupo");
  const isFijo = !!(node && node.tipo==="fijo");
  const isCab = !!(node && node.tipo==="cabina");
  const isCart = !!(node && node.tipo==="cartoon");
  root.innerHTML = `
  <header class="top">
    <button class="btn icon ${path.length?"":"hidden"}" id="back" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="titles"><h1>${esc(node?node.titulo:menu.nombre)}</h1>${path.length?`<div class="crumbs">${names.slice(0,-1).map(esc).join(" › ")}</div>`:""}</div>
    ${path.length?`<button class="homebtn" id="goHome" aria-label="Volver al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Volver al inicio</span></button>`:""}
    ${editing?`<button class="btn" id="settings">Ajustes</button>`:""}
    <button class="btn ${editing?"on":""}" id="edit">${editing?"Listo":"Editar"}</button>
    <button class="btn icon" id="lock" aria-label="Bloquear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  </header>
  <main class="${editing?"editing":""}">
    ${!db?`<div class="banner">${API_URL?"No se pudo conectar con Google. Recarga la página; si sigue, revisa internet.":"Falta conectar con Google: por ahora los cambios se guardan solo en este equipo."}</div>`:""}
    ${isCart ? cartoonHTML(node) : isCab ? cabHTML(node) : isFijo ? fijoHTML(node) : isGrp ? grupoHTML(node) : isMed ? medidasHTML(node) : list.length||editing ? `<div class="grid${list.length+(editing?1:0)===1?" one":""}" style="--n:${Math.min(list.length+(editing?1:0),3)};--n2:${Math.min(list.length+(editing?1:0),2)}">${list.map((t,i)=>tileHTML(t,i,list.length)).join("")}
      ${editing?`<button class="add-tile" id="addTile">+ Añadir botón</button>`:""}</div>${!path.length&&!editing?`<button class="gen" id="verCots" style="display:block;margin:34px auto 0;font-size:clamp(30px,4.4vw,44px);padding:20px 56px">Ver cotizaciones</button>`:""}`
      : `<div class="empty">Aquí todavía no hay nada.<br>Toca <b>Editar</b> para añadir botones.</div>`}
  </main>`;
  document.getElementById("edit").addEventListener("click",()=>{editing=!editing;med.draft=null;grp.draft=null;grp.accDraft=null;fx.draft=null;cab.draft=null;ct.draft=null;imgMode=false;renderApp();});
  document.getElementById("lock").addEventListener("click",lockNow);
  const gh=document.getElementById("goHome"); if(gh) gh.addEventListener("click",()=>{ path=[]; editing=false; imgMode=false; med.sel=null; med.draft=null; med.acc={}; med.accOpen=false; fx.draft=null; grpReset(); cabReset(); ctReset(); renderApp(); window.scrollTo(0,0); });
  const bk=document.getElementById("back"); bk.addEventListener("click",()=>{
    if(isCab && (!editing||imgMode) && cabBack()){ }
    else if(isCart && (!editing||imgMode) && ctBack()){ }
    else if(isGrp && grp.accFor!=null){ grp.accFor=null; grp.accDraft=null; if(editing) editing=false; }
    else if(isGrp && !editing && (grp.result||grp.n||grp.size)){ if(grp.result) grp.result=false; else if(grp.n) grp.n=null; else grp.size=null; }
    else if(isFijo && med.accOpen){ med.accOpen=false; grp.accDraft=null; if(editing) editing=false; }
    else if(isMed && med.accOpen){ med.accOpen=false; grp.accDraft=null; if(editing) editing=false; }
    else if(isMed && med.sel!=null && !editing){med.sel=null;med.acc={};}
    else {path.pop();med.sel=null;med.draft=null;med.acc={};med.accOpen=false;fx.draft=null;grpReset();cabReset();ctReset();editing=false;}
    renderApp();window.scrollTo(0,0);});
  if(isCart){ const st4=document.getElementById("settings"); if(st4) st4.addEventListener("click",openSettings); bindCartoon(node); return; }
  if(isCab){ const st3=document.getElementById("settings"); if(st3) st3.addEventListener("click",openSettings); bindCab(node); return; }
  if(isFijo){ const st2=document.getElementById("settings"); if(st2) st2.addEventListener("click",openSettings); bindFijo(node); return; }
  if(isGrp){ const st1=document.getElementById("settings"); if(st1) st1.addEventListener("click",openSettings); bindGrupo(node); return; }
  if(isMed){ const st0=document.getElementById("settings"); if(st0) st0.addEventListener("click",openSettings); bindMedidas(node); return; }
  const st=document.getElementById("settings"); if(st) st.addEventListener("click",openSettings);
  const vc=document.getElementById("verCots"); if(vc) vc.onclick=()=>{ qview=true; qcache=null; renderApp(); window.scrollTo(0,0); };
  const add=document.getElementById("addTile"); if(add) add.addEventListener("click",()=>openTileEditor(null));
  root.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",e=>{
    if(e.target.closest(".tools")) return;
    path.push(el.dataset.open); med.sel=null; med.draft=null; med.acc={}; med.accOpen=false; fx.draft=null; grpReset(); cabReset(); ctReset(); renderApp(); window.scrollTo(0,0);
  }));
  root.querySelectorAll("[data-tool]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    const [act,id]=b.dataset.tool.split(":"); const i=list.findIndex(t=>t.id===id);
    if(act==="edit") openTileEditor(list[i]);
    if(act==="left"&&i>0){[list[i-1],list[i]]=[list[i],list[i-1]];saveMenu();renderApp();}
    if(act==="right"&&i<list.length-1){[list[i+1],list[i]]=[list[i],list[i+1]];saveMenu();renderApp();}
    if(act==="del") confirmDelete(list,i);
  }));
}

const money = n => "$" + Math.round(Number(n)).toLocaleString("es-CL");
const cmTxt = n => String(n).replace(".",",");
const numIn = v => { const x=String(v==null?"":v).trim().replace(/[$\s]/g,"").replace(/\./g,"").replace(",","."); return x===""?NaN:Number(x); };
const cmIn = v => { const x=String(v==null?"":v).trim().replace(",","."); return x===""?NaN:Number(x); };

function medidasHTML(node){
  const L=(node.medidas||[]).slice().sort((a,b)=>a.cm-b.cm);
  if(med.accOpen) return accHTML(med.acc, `${cmTxt(med.sel)} cm · Accesorios`, "Accesorios");
  if(editing){
    if(!med.draft) med.draft={encabezado:node.encabezado||"Centímetros", rows:L.map(r=>({cm:cmTxt(r.cm), precio:r.precio==null?"":String(r.precio), oculto:!!r.oculto}))};
    const d=med.draft;
    return `<div class="med-edit">
      <label class="lbl" for="mHead">Título de arriba</label>
      <input class="inp" id="mHead" value="${esc(d.encabezado)}">
      <span class="lbl">Medidas y precios</span>
      <div class="med-row head"><span>Centímetros</span><span>Precio</span><span style="text-align:center">Visible</span><span></span></div>
      ${d.rows.map((r,i)=>`<div class="med-row">
        <input class="inp" inputmode="decimal" value="${esc(r.cm)}" data-r="${i}" data-f="cm" aria-label="Centímetros">
        <input class="inp" inputmode="numeric" value="${esc(r.precio)}" data-r="${i}" data-f="precio" placeholder="Ej: 36000" aria-label="Precio">
        <label class="vis"><input type="checkbox" data-vis="${i}" ${r.oculto?"":"checked"} aria-label="Mostrar como botón"></label>
        <button class="del-x" data-rmr="${i}" aria-label="Quitar medida">×</button></div>`).join("")}
      <p class="small">Las medidas sin “Visible” no aparecen como botón, pero se usan para calcular grupos.</p>

let grp = {size:null, n:null, hs:[], result:false, draft:null, acc:{}, accFor:null, accDraft:null};
function grpReset(){ grp = {size:null, n:null, hs:[], result:false, draft:null, acc:{}, accFor:null, accDraft:null}; }
function catalog(){ return menu.accesorios = menu.accesorios || []; }
function accList(sel){
  sel = sel || {}; const out=[];
  for(const a of catalog()){ const q=sel[a.id]||0; if(q>0) out.push({a,q,sub:q*(Number(a.precio)||0)}); }
  return out;
}
function accOf(i){ return accList(grp.acc[i]); }
function accTotal(i){ return accOf(i).reduce((s,x)=>s+x.sub,0); }
function accSum(sel){ return accList(sel).reduce((s,x)=>s+x.sub,0); }
function accLineHTML(sel, btnAttr){
  const L=accList(sel);
  return `<div class="accline">${L.map(x=>`<span>+ ${esc(x.a.nombre)}${x.q>1?" x"+x.q:""} <b>${money(x.sub)}</b></span>`).join("")}
    <button class="accbtn" ${btnAttr}>${L.length?"Cambiar accesorios":"Agregar accesorios"}</button></div>`;
}

      ${d.map((a,k)=>`<div class="med-row" style="grid-template-columns:1.6fr 1fr 44px">
        <input class="inp" value="${esc(a.nombre)}" data-ak="${k}" data-af="nombre" placeholder="Ej: Mascota" aria-label="Accesorio">
        <input class="inp" inputmode="numeric" value="${esc(a.precio)}" data-ak="${k}" data-af="precio" placeholder="Ej: 15000" aria-label="Precio">

    : `<div class="empty">Aún no hay accesorios.<br>Toca <b>Editar</b> para crear la lista con sus precios.</div>`}

function bindAcc(getSel, onDone){
  root.querySelectorAll("[data-aq]").forEach(b=>b.onclick=()=>{

    sel[id] = Math.max(0,(sel[id]||0)+Number(d)); if(!sel[id]) delete sel[id];
    renderApp();
  });

  if(!editing) return;
  const d=grp.accDraft;
  root.querySelectorAll("[data-ak]").forEach(inp=>inp.oninput=e=>{d[Number(e.target.dataset.ak)][e.target.dataset.af]=e.target.value;});
  root.querySelectorAll("[data-ark]").forEach(b=>b.onclick=()=>{d.splice(Number(b.dataset.ark),1);renderApp();});
  document.getElementById("aAdd").onclick=()=>{d.push({id:uid(),nombre:"",precio:""});renderApp();
    const ins=root.querySelectorAll('[data-af="nombre"]'); if(ins.length) ins[ins.length-1].focus();};
  document.getElementById("aSave").onclick=()=>{
    menu.accesorios = d.filter(a=>String(a.nombre).trim()).map(a=>{const p=numIn(a.precio); return {id:a.id||uid(), nombre:String(a.nombre).trim(), precio: p>=0?p:null};});
    saveMenu(); grp.accDraft=null; editing=false; renderApp(); toast("Accesorios guardados");

function priceSource(node){
  let src=null;
  walk(menu.tiles, t=>{ if(!src && t.id===(node.fuente||"cab1") && t.tipo==="medidas") src=t; });
  if(!src) walk(menu.tiles, t=>{ if(!src && t.tipo==="medidas") src=t; });
  return src;
}
const toCm = v => { const x=cmIn(v); if(!(x>0)) return NaN; return x<3 ? x*100 : x; }; // 1,80 m -> 180 cm
function tierUp(L, cm){
  if(!L.length) return null;
  if(cm <= L[0].cm) return L[0];
  for(const t of L){ if(t.cm >= cm - 1e-9) return t; }
  return "over";
}
function calcGroup(node){
  const src=priceSource(node);
  const L=src? (src.medidas||[]).slice().sort((a,b)=>a.cm-b.cm) : [];
  const hs=grp.hs.map(toCm);
  const H=Math.max(...hs);
  const rows=hs.map((h,i)=>{
    const fig = grp.size*h/H;
    const t = tierUp(L, fig);
    const ok = t && t!=="over" && t.precio!=null && !isNaN(t.precio);
    return {i, h, fig, t, precio: ok? t.precio : null};
  });
  rows.forEach(r=>{ r.acc=accOf(r.i); r.accSum=accTotal(r.i); });
  const total=rows.reduce((s,r)=>s+(r.precio||0)+r.accSum,0);
  const faltan=rows.filter(r=>r.precio==null);
  return {rows,total,faltan,H,src};
}

      ${c.faltan.length?`<p class="warn-txt">${c.faltan.length} persona${c.faltan.length>1?"s":""} sin precio: falta el precio de esa medida en la tabla de “1 persona”.</p>`:""}
      <div class="row-btns" style="max-width:520px;margin:26px auto 0">
        <button class="btn" id="gEditH">Cambiar medidas</button>
        <button class="btn primary" id="gNew">Nueva cotización</button></div></div>`;
  }
  // Paso 3: medidas de cada persona
  if(grp.n){
    return `<div class="med">
      <div class="pillhead">${grp.n} personas</div>
      <p class="small" style="margin:-18px 0 18px">Medida real de cada uno, en metros (1,80) o centímetros (180)</p>
      <div class="hlist">${Array.from({length:grp.n},(_,i)=>`<label class="hrow"><span class="hn">${i+1}:</span>

/* ---- Cálculos ---- */
function tbl(kind,tabla){ return ((P[kind]||{})[tabla]||[]).filter(r=>r.cm>0).slice().sort((a,b)=>a.cm-b.cm); }
function priceAt(kind,tabla,cm){ const r=tbl(kind,tabla).find(x=>x.cm===cm); return r&&r.precio!=null&&!isNaN(r.precio)?r.precio:null; }
function posMult(pos){ return pos==="arrod"?P.mult.arrod : pos==="suelo"?P.mult.suelo : 1; }
function itemPrice(base,it,unida){ return Math.round(base*((it.g||0)*P.pct.grande + (it.c||0)*(unida?P.pct.chicoUnidas:P.pct.chicoSolas))/100); }
function accItems(acc,base,unida){ const out=[]; for(const it of P.accesorios){ const q=(acc||{})[it.id]||0; if(q>0) out.push({it,q,sub:q*itemPrice(base||0,it,unida)}); } return out; }
function accTot(acc,base,unida){ return accItems(acc,base,unida).reduce((s,x)=>s+x.sub,0); }
function extItems(q){
  const out=[]; for(const e of P.extras){ const n=(q.ext||{})[e.id]||0; if(n>0) out.push({nombre:e.nombre,q:n,sub:n*(Number(e.precio)||0)}); }
  if(q.modP) out.push({nombre:"Modelado desde foto (persona)",q:q.modP,sub:q.modP*P.modelado.persona});
  if(q.modM) out.push({nombre:"Modelado desde foto (mascota)",q:q.modM,sub:q.modM*P.modelado.mascota});
  return out;
}
function extTot(q){ return extItems(q).reduce((s,x)=>s+x.sub,0); }
function toM(v){ const x=cmIn(v); if(!(x>0)) return NaN; return x>3 ? x/100 : x; }
function petPrice(cm,pos){ const r=(P.mascotas||[]).find(m=>m.cm===cm); return r&&r[pos]!=null&&!isNaN(r[pos])?r[pos]:null; }
function petGroupCm(size,raza){
  const rows=(P.mascotaGrupo||[]).slice().sort((a,b)=>a.talla-b.talla);
  if(!rows.length) return P.mascotaSola[raza]||4;
  let row=rows[0]; for(const r of rows){ if(r.talla<=size) row=r; }
  return row[raza]||4;
}

function calcSola(q){
  const base = priceAt("solas",q.tabla,q.cm);
  if(base==null) return {base:null,total:null};
  const fig = q.tabla==="bebe" ? base : Math.round(base*posMult(q.pos));
  const acc = accTot(q.acc,base,false), ext=extTot(q);
  // Mascotas junto a 1 persona: mismo tamaño y precio que en grupo, según la medida de la figura
  const pets=(q.pets||[]).map((pt,i)=>{ const cm=petGroupCm(q.cm,pt.raza); return {i,raza:pt.raza,pos:pt.pos,cm,precio:petPrice(cm,pt.pos)}; });
  const petsTot=pets.reduce((s,p)=>s+(p.precio||0),0);
  return {base, fig, acc, ext, pets, petsTot, total:fig+acc+petsTot+ext};
}
function calcGrupo(q){
  const hs=q.hs.map(toM), H=Math.max(...hs);
  // Regla: el grupo usa la tabla de unidas normal; solo si TODOS miden hasta 1,40 m se usa la de bajos
  const todosBajos = hs.length>0 && hs.every(h=>h <= P.umbral+1e-9);
  const tablaGrupo = todosBajos ? "bajo" : "alto";
  const per=hs.map((h,i)=>{
    const tabla = tablaGrupo;
    const fig = q.size*h/H;
    const t = tierUp(tbl("unidas",tabla), fig);
    const base = t && t!=="over" && t.precio!=null ? t.precio : null;
    const p = q.per[i]||{pos:"pie",acc:{}};
    const figP = base!=null ? Math.round(base*posMult(p.pos)) : null;
    const acc = base!=null ? accTot(p.acc,base,true) : 0;
    return {i,h,tabla,fig,cm:t&&t!=="over"?t.cm:null,base,figP,acc,pos:p.pos};
  });
  const pets=q.pets.map((pt,i)=>{ const cm=petGroupCm(q.size,pt.raza); return {i,raza:pt.raza,pos:pt.pos,cm,precio:petPrice(cm,pt.pos)}; });
  const ext=extTot(q);
  const faltan = per.filter(r=>r.base==null).length + pets.filter(p=>p.precio==null).length;
  const total = per.reduce((s,r)=>s+(r.figP||0)+r.acc,0) + pets.reduce((s,p)=>s+(p.precio||0),0) + ext;
  return {per,pets,ext,total,faltan,tablaGrupo};
}
function calcMascota(q){
  const cm=P.mascotaSola[q.raza]||4, precio=petPrice(cm,q.pos), ext=extTot(q);
  return {cm, precio, ext, total:(precio||0)+ext};
}

      <div class="accsum">Accesorios: ${money(sum)}</div>
      <button class="gen" data-a="back">Listo</button></div>`;
  }

  if(s==="ext"){
    const row=(nombre,precio,n,attr)=>`<div class="accitem ${n?"on":""}"><div class="an">${esc(nombre)}<span class="ap">${money(precio)}</span></div>
      <div class="qty"><button ${attr} data-d="-1" aria-label="Quitar" ${n?"":"disabled"}>−</button><span>${n}</span><button ${attr} data-d="1" aria-label="Agregar">+</button></div></div>`;
    return `<div class="med"><div class="pillhead">Bases y extras</div>
      <div class="acclist">${P.extras.map(e=>row(e.nombre,e.precio,q.ext[e.id]||0,`data-a="eq" data-v="${e.id}"`)).join("")}
        ${q.modo!=="mascota"?row("Modelado desde foto (persona)",P.modelado.persona,q.modP||0,'data-a="mod" data-v="modP"'):""}
        ${q.modo!=="sola"||(q.pets&&q.pets.length)?row("Modelado desde foto (mascota)",P.modelado.mascota,q.modM||0,'data-a="mod" data-v="modM"'):""}</div>
      <div class="accsum">Extras: ${money(extTot(q))}</div>
      <button class="gen" data-a="back">Listo</button></div>`;
  }
  return "";
}

function cabText(){
  const q=cab.q, L=[];
  if(q.modo==="sola"){ const c=calcSola(q);
    L.push(`Figura ${cmTxt(q.cm)} cm · ${TABLA_TXT[q.tabla]}${q.tabla!=="bebe"&&q.pos!=="pie"?" · "+POS_TXT[q.pos]:""}: ${money(c.fig)}`);
    accItems(q.acc,c.base,false).forEach(x=>L.push(`+ ${x.it.nombre}${x.q>1?" x"+x.q:""}: ${money(x.sub)}`));
    (c.pets||[]).forEach(p=>L.push(`${RAZA_TXT[p.raza]} ${cmTxt(p.cm)} cm · ${PPOS_TXT[p.pos]}: ${mFmt(p.precio)}`));
    extItems(q).forEach(x=>L.push(`+ ${x.nombre}${x.q>1?" x"+x.q:""}: ${money(x.sub)}`)); L.push(`Total: ${money(c.total)}`);
  } else if(q.modo==="grupo"){ const c=calcGrupo(q);
    L.push(`Figura grupal ${cmTxt(q.size)} cm${c.tablaGrupo==="bajo"?" (todos hasta 1,40 m)":""}`);
    c.per.forEach(r=>{ L.push(`Persona ${r.i+1} (${mts(r.h)}) ${cmTxt(r.cm)} cm${r.pos!=="pie"?" · "+POS_TXT[r.pos]:""}: ${mFmt(r.figP)}`);
      if(r.base!=null) accItems(q.per[r.i].acc,r.base,true).forEach(x=>L.push(`   + ${x.it.nombre}${x.q>1?" x"+x.q:""}: ${money(x.sub)}`)); });
    c.pets.forEach(p=>L.push(`${RAZA_TXT[p.raza]} ${cmTxt(p.cm)} cm · ${PPOS_TXT[p.pos]}: ${mFmt(p.precio)}`));
    extItems(q).forEach(x=>L.push(`+ ${x.nombre}${x.q>1?" x"+x.q:""}: ${money(x.sub)}`)); L.push(`Total: ${money(c.total)}`);
  } else { const c=calcMascota(q);
    L.push(`${RAZA_TXT[q.raza]} ${cmTxt(c.cm)} cm · ${PPOS_TXT[q.pos]}: ${mFmt(c.precio)}`);
    extItems(q).forEach(x=>L.push(`+ ${x.nombre}${x.q>1?" x"+x.q:""}: ${money(x.sub)}`)); L.push(`Total: ${money(c.total)}`);
  }
  return L.join("\n");
}
async function copyTxt(t){
  try{ await navigator.clipboard.writeText(t); toast("Cotización copiada"); return; }catch(e){}
  try{ const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Cotización copiada"); }
  catch(e){ toast("No se pudo copiar"); }
}

function bindCab(node){
  root.onclick = e=>{
    if(handleImgClick(e)) return;
    const b=e.target.closest("[data-a]"); if(!b || !root.contains(b)) return;
    const a=b.dataset.a, v=b.dataset.v, i=Number(b.dataset.i), d=Number(b.dataset.d), q=cab.q;
    if(a==="start"){
      if(v==="sola"){ cab.q={modo:"sola",tabla:null,cm:null,pos:"pie",acc:{},ext:{},modP:0,modM:0,pets:[]}; cabGo("estatura"); }
      if(v==="grupo"){ cab.q={modo:"grupo",size:null,n:null,hs:[],per:[],pets:[],ext:{},modP:0,modM:0}; cabGo("gsize"); }
      if(v==="mascota"){ cab.q={modo:"mascota",raza:null,pos:"parado",ext:{},modM:0}; cabGo("mraza"); }
    }
    else if(a==="tabla"){ q.tabla=v; cabGo("cm"); }
    else if(a==="cm"){ q.cm=Number(v); q.pos="pie"; q.acc={}; cabGo("res1"); }
    else if(a==="pos"){ q.pos=v; renderApp(); }
    else if(a==="gsize"){ q.size=Number(v); cabGo("gn"); }
    else if(a==="gn"){ const n=Number(v); q.n=n; q.hs=q.hs.slice(0,n); q.per=Array.from({length:n},(_,k)=>q.per[k]||{pos:"pie",acc:{}}); cabGo("gh"); const f=root.querySelector(".hin"); if(f) f.focus(); }
    else if(a==="addpet"){ q.pets.push({raza:"chica",pos:"parado"}); renderApp(); }
    else if(a==="praza"){ q.pets[i].raza=v; renderApp(); }
    else if(a==="rmpet"){ q.pets.splice(i,1); renderApp(); }
    else if(a==="gen"){
      const bad=[]; for(let k=0;k<q.n;k++){ if(!(toM(q.hs[k])>0)) bad.push(k+1); }
      if(bad.length){ document.getElementById("gErr").textContent=`Falta o está mal la estatura de: ${bad.join(", ")}`; const f=root.querySelector(`[data-h="${bad[0]-1}"]`); if(f) f.focus(); return; }
      cabGo("gres");
    }
    else if(a==="ppos"){ q.per[i].pos=v; renderApp(); }
    else if(a==="petpos"){ q.pets[i].pos=v; renderApp(); }
    else if(a==="raza"){ q.raza=v; cabGo("mpos"); }
    else if(a==="mpos"){ q.pos=v; cabGo("mres"); }
    else if(a==="mposc"){ q.pos=v; renderApp(); }
    else if(a==="acc"){ cab.accFor = v==="s" ? "s" : Number(v); cabGo("acc"); }
    else if(a==="aq"){ const acc = cab.accFor==="s" ? q.acc : q.per[cab.accFor].acc; acc[v]=Math.max(0,(acc[v]||0)+d); if(!acc[v]) delete acc[v]; renderApp(); }
    else if(a==="ext"){ cabGo("ext"); }
    else if(a==="eq"){ q.ext[v]=Math.max(0,(q.ext[v]||0)+d); if(!q.ext[v]) delete q.ext[v]; renderApp(); }
    else if(a==="mod"){ q[v]=Math.max(0,(q[v]||0)+d); renderApp(); }
    else if(a==="back"){ if(cabBack()) { renderApp(); window.scrollTo(0,0); } }
    else if(a==="new"){ cabReset(); renderApp(); window.scrollTo(0,0); }
    else if(a==="copy"){ copyTxt(cabText()); }
    else if(a==="pdf"){ openQuoteForm(cabLines); }
  };
  root.querySelectorAll("[data-h]").forEach(inp=>{
    inp.oninput=e=>{ cab.q.hs[Number(e.target.dataset.h)]=e.target.value; };
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); const nx=root.querySelector(`[data-h="${Number(e.target.dataset.h)+1}"]`); if(nx) nx.focus(); else { const g=root.querySelector('[data-a="gen"]'); if(g) g.click(); } } };
  });
  if(editing){ bindModeToggle(); if(!imgMode) bindCabEditor(); }
}

function getPath(o,p){ return p.split(".").reduce((x,k)=>x==null?x:x[k], o); }
function setPath(o,p,v){ const ks=p.split("."); let x=o; for(let k=0;k<ks.length-1;k++) x=x[ks[k]]; x[ks[ks.length-1]]=v; }
function fmtIn(v,t){ if(v==null||(typeof v==="number"&&isNaN(v))) return ""; return t==="d"? cmTxt(v) : String(v); }
function edTable(title, path, cols, note){
  const arr=getPath(cab.draft,path)||[];
  const gt=`grid-template-columns:${cols.map(c=>c.w||"1fr").join(" ")} 40px`;
  return `<div class="card-ed"><h4>${esc(title)}</h4>${note?`<p class="small" style="margin:0 0 8px">${esc(note)}</p>`:""}
    <div class="ed-row head" style="${gt}">${cols.map(c=>`<span>${esc(c.l)}</span>`).join("")}<span></span></div>
    ${arr.map((r,i)=>`<div class="ed-row" style="${gt}">${cols.map(c=>`<input class="inp" ${c.t==="t"?"":`inputmode="${c.t==="d"?"decimal":"numeric"}"`} data-ep="${path}.${i}.${c.k}" data-t="${c.t}" value="${esc(fmtIn(r[c.k],c.t))}" aria-label="${esc(c.l)}">`).join("")}
      <button class="del-x" data-erm="${path}" data-i="${i}" aria-label="Quitar fila">×</button></div>`).join("")}
    <button class="add-line" data-eadd="${path}">+ Añadir fila</button></div>`;
}
function edField(label, path, t){ return `<label class="ed-f"><span>${esc(label)}</span><input class="inp" ${t==="t"?"":`inputmode="${t==="d"?"decimal":"numeric"}"`} data-ep="${path}" data-t="${t}" value="${esc(fmtIn(getPath(cab.draft,path),t))}"></label>`; }

function bindCabEditor(){
  const d=cab.draft;
  root.querySelectorAll("[data-ep]").forEach(inp=>inp.oninput=e=>{
    const t=e.target.dataset.t, raw=e.target.value;
    setPath(d, e.target.dataset.ep, t==="t" ? raw : t==="d" ? cmIn(raw) : numIn(raw));
  });
  root.querySelectorAll("[data-eadd]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); const arr=getPath(d,b.dataset.eadd);
    const proto = arr[0] ? Object.fromEntries(Object.keys(arr[0]).map(k=>[k, k==="nombre"?"":NaN])) : {};
    if("id" in proto || b.dataset.eadd==="accesorios" || b.dataset.eadd==="extras") proto.id=uid();
    arr.push(proto); renderApp(); });
  root.querySelectorAll("[data-erm]").forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); getPath(d,b.dataset.erm).splice(Number(b.dataset.i),1); renderApp(); });
  const rs=document.getElementById("edReset"); rs.onclick=ev=>{ ev.stopPropagation();
    if(rs.dataset.armed!=="1"){ rs.dataset.armed="1"; rs.textContent="Toca otra vez para confirmar"; rs.style.color="var(--danger)"; return; }
    cab.draft=null; P=clone(DEFAULT_P); savePrecios(); renderApp(); toast("Precios de la planilla restaurados"); };
  document.getElementById("edSave").onclick=ev=>{
    ev.stopPropagation();
    const n = v => (typeof v==="number" && !isNaN(v)) ? v : null;
    const cleanT = a => (a||[]).filter(r=>n(r.cm)>0).map(r=>({cm:r.cm, precio:n(r.precio)})).sort((x,y)=>x.cm-y.cm);
    const out = clone(d);
    out.solas={alto:cleanT(d.solas.alto),bajo:cleanT(d.solas.bajo),bebe:cleanT(d.solas.bebe)};
    out.unidas={alto:cleanT(d.unidas.alto),bajo:cleanT(d.unidas.bajo)};
    out.accesorios=(d.accesorios||[]).filter(a=>String(a.nombre||"").trim()).map(a=>({id:a.id||uid(),nombre:String(a.nombre).trim(),g:n(a.g)||0,c:n(a.c)||0}));
    out.extras=(d.extras||[]).filter(a=>String(a.nombre||"").trim()).map(a=>({id:a.id||uid(),nombre:String(a.nombre).trim(),precio:n(a.precio)||0}));
    out.mascotas=(d.mascotas||[]).filter(r=>n(r.cm)>0).map(r=>({cm:r.cm,parado:n(r.parado),sentado:n(r.sentado),acostado:n(r.acostado),echado:n(r.echado)}));
    out.mascotaGrupo=(d.mascotaGrupo||[]).filter(r=>n(r.talla)>0).map(r=>({talla:r.talla,chica:n(r.chica)||4,mediana:n(r.mediana)||4,grande:n(r.grande)||4,gato:n(r.gato)||4}));
    out.grupo={tallas:[...new Set(String(d._tallas||"").split(/[\s,;]+/).map(Number).filter(x=>x>0))].sort((a,b)=>a-b), max: n(d.grupo.max)>=1 ? Math.min(30,Math.round(d.grupo.max)) : 10};
    out.umbral = n(d.umbral)>0 ? d.umbral : 1.40;
    ["arrod","suelo"].forEach(k=>{ if(!(n(out.mult[k])>0)) out.mult[k]=DEFAULT_P.mult[k]; });
    ["grande","chicoSolas","chicoUnidas"].forEach(k=>{ if(!(n(out.pct[k])>=0)) out.pct[k]=DEFAULT_P.pct[k]; });
    Object.keys(RAZA_TXT).forEach(k=>{ if(!(n(out.mascotaSola[k])>0)) out.mascotaSola[k]=DEFAULT_P.mascotaSola[k]; });
    ["persona","mascota"].forEach(k=>{ if(!(n(out.modelado[k])>=0)) out.modelado[k]=DEFAULT_P.modelado[k]; });
    delete out._tallas;
    P=out; savePrecios(); cab.draft=null; editing=false; renderApp(); window.scrollTo(0,0); toast("Precios guardados");
  };
}

const CPOS_TXT = {pie:"De pie", sentado:"Sentado o hincado", piso:"En el piso o cuclillas"};
const CAT_DIRECTO = ["k6"];   // categorías de un solo producto que pasan directo a sus estilos
const catDirecta = k => k && CAT_DIRECTO.includes(k.id) && k.productos.length===1;

let ct = {hist:[], scr:"cats", cat:null, prod:null, cm:null, estilo:null, tipo:null, pos:"pie", acc:{}, draft:null};
function ctReset(){ ct = {hist:[], scr:"cats", cat:null, prod:null, cm:null, estilo:null, tipo:null, pos:"pie", acc:{}, draft:null}; }
function ctGo(s){ ct.hist.push(ct.scr); ct.scr=s; renderApp(); window.scrollTo(0,0); }
function ctBack(){ if(ct.hist.length){ ct.scr=ct.hist.pop(); return true; } return false; }
function ctCat(){ return C.cats.find(k=>k.id===ct.cat); }
function ctProd(){ const k=ctCat(); return k ? k.productos.find(p=>p.id===ct.prod) : null; }
const okP = v => v!=null && !isNaN(v) && v>0;
function prodMeds(p){ return (p.medidas||[]).filter(m=>m.cm>0).slice().sort((a,b)=>a.cm-b.cm); }
function prodDesde(p){ const ps=prodMeds(p).map(m=>m.precio).filter(okP); return ps.length? Math.min(...ps) : null; }
function cItemPrice(base,it){ return Math.round(base*((it.g||0)*C.mods.grande + (it.c||0)*C.mods.chico)/100); }
function prodAcc(p){ return p.acc!=null ? !!p.acc : !SIN_ACC.includes(p.id); }
function cAccList(){ return (C.accesorios && C.accesorios.length) ? C.accesorios : DEFAULT_C.accesorios; }
function cAccItems(base){ const out=[]; for(const it of cAccList()){ const q=ct.acc[it.id]||0; if(q>0) out.push({it,q,sub:q*cItemPrice(base,it)}); } return out; }
function ctCalc(){
  const p=ctProd(); const m=p && prodMeds(p).find(x=>x.cm===ct.cm);
  const base = m && okP(m.precio) ? m.precio : null;
  if(base==null) return {base:null};
  const mult = p.mods ? (ct.pos==="sentado" ? 1+C.mods.sentado/100 : ct.pos==="piso" ? 1+C.mods.piso/100 : 1) : 1;
  const fig = Math.round(base*mult);
  const items = prodAcc(p) ? cAccItems(base) : [];
  const acc = items.reduce((s,x)=>s+x.sub,0);
  return {base, fig, items, acc, total:fig+acc};
}

function ctText(){
  const p=ctProd(), k=ctCat(), c=ctCalc(), L=[];
  L.push(`${k.nombre}: ${p.nombre} ${cmTxt(ct.cm)} cm${ct.estilo?" · estilo "+ct.estilo:""}${ct.tipo?" · "+ct.tipo:""}${p.mods&&ct.pos!=="pie"?" · "+CPOS_TXT[ct.pos]:""}: ${money(c.fig)}`);
  (c.items||[]).forEach(x=>L.push(`+ ${x.it.nombre}${x.q>1?" x"+x.q:""}: ${money(x.sub)}`));
  L.push(`Total: ${money(c.total)}`);
  return L.join("\n");
}

function bindCartoon(node){
  root.onclick = e=>{
    if(handleImgClick(e)) return;
    const b=e.target.closest("[data-a]"); if(!b || !root.contains(b)) return;
    const a=b.dataset.a, v=b.dataset.v, d=Number(b.dataset.d);
    const startProd = id=>{ ct.prod=id; ct.estilo=null; ct.tipo=null; ct.pos="pie"; ct.acc={};
      const p=ctProd(), ms=prodMeds(p);
      if(p.tipos && p.tipos.length) ctGo("tipo");
      else if(p.estilos && p.estilos.length) ctGo("estilo");
      else if(ms.length===1){ ct.cm=ms[0].cm; ctGo("res"); } else ctGo("cm"); };
    if(a==="cat"){ ct.cat=v; const k=ctCat(); if(catDirecta(k)) startProd(k.productos[0].id); else ctGo("prods"); }
    else if(a==="prod"){ startProd(v); }
    else if(a==="ctipo"){ ct.tipo=v; ct.estilo=null; const p=ctProd(), ms=prodMeds(p);
      if(p.estilos && p.estilos.length) ctGo("estilo");
      else if(ms.length===1){ ct.cm=ms[0].cm; ctGo("res"); } else ctGo("cm"); }
    else if(a==="cest"){ ct.estilo=v; const ms=prodMeds(ctProd());
      if(ms.length===1){ ct.cm=ms[0].cm; ctGo("res"); } else ctGo("cm"); }
    else if(a==="ccm"){ ct.cm=Number(v); ct.pos="pie"; ct.acc={}; ctGo("res"); }
    else if(a==="estilo"){ ct.estilo = ct.estilo===v ? null : v; renderApp(); }
    else if(a==="tipo"){ ct.tipo = ct.tipo===v ? null : v; renderApp(); }
    else if(a==="cpos"){ ct.pos=v; renderApp(); }
    else if(a==="cacc"){ ctGo("acc"); }
    else if(a==="caq"){ ct.acc[v]=Math.max(0,(ct.acc[v]||0)+d); if(!ct.acc[v]) delete ct.acc[v]; renderApp(); }
    else if(a==="cback"){ if(ctBack()){ renderApp(); window.scrollTo(0,0); } }
    else if(a==="cnew"){ ctReset(); renderApp(); window.scrollTo(0,0); }
    else if(a==="ccopy"){ copyTxt(ctText()); }
    else if(a==="cpdf"){ openQuoteForm(ctLines); }
  };
  if(editing){ bindModeToggle(); if(!imgMode) bindCartoonEditor(); }
}

    });
    c.pets.forEach(p=>L.push({d:`${RAZA_TXT[p.raza]} · ${cmTxt(p.cm)} cm · ${PPOS_TXT[p.pos]}`, v:p.precio}));
  } else { const c=calcMascota(q); total=c.total;
    titulo="Figura en cabina · mascota";
    L.push({d:`${RAZA_TXT[q.raza]} · ${cmTxt(c.cm)} cm · ${PPOS_TXT[q.pos]}`, v:c.precio});
  }
  extItems(q).forEach(x=>L.push({d:`${x.nombre}${x.q>1?" x"+x.q:""}`, v:x.sub}));
  return {titulo, lines:L, total, cabina:true};
}
function ctLines(){
  const p=ctProd(), k=ctCat(), c=ctCalc(), L=[];
  const det=[`${cmTxt(ct.cm)} cm`]; if(ct.estilo) det.push("estilo "+ct.estilo); if(ct.tipo) det.push(ct.tipo); if(p.mods&&ct.pos!=="pie") det.push(CPOS_TXT[ct.pos]);
  L.push({d:`${p.nombre} · ${det.join(" · ")}`, v:c.fig});
  (c.items||[]).forEach(x=>L.push({d:`${x.it.nombre}${x.q>1?" x"+x.q:""}`, v:x.sub, ind:true}));
  return {titulo:`Figura cartoon · ${k.nombre}`, lines:L, total:c.total, cabina:false};
}

function cotNumero(){ const d=new Date(), z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`; }
function logoData(){ return null; }
const pdfMoney = n => n==null ? "Consultar" : "$" + Math.round(Number(n)).toLocaleString("es-CL");

function buildPDF(info, data){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const E=empresa(), W=210, M=18, GREEN=[59,179,62], GTXT=[84,160,64], INK=[22,23,29], MUTED=[98,101,122];
  const FOOT=262;
  let y=14;
  const newPage=()=>{ footer(); doc.addPage(); y=M; };
  const need=h=>{ if(y+h > FOOT-6) newPage(); };
  function footer(){
    doc.setDrawColor(...GREEN); doc.setLineWidth(0.6); doc.line(0, FOOT, W, FOOT);
    doc.setTextColor(...GTXT); doc.setFont("helvetica","normal");
    let fy=FOOT+9;
    if(E.web){ doc.setFontSize(15); doc.text(E.web, W/2, fy, {align:"center"}); fy+=6.5; }
    if(E.correo){ doc.setFontSize(11); doc.text(E.correo, W/2, fy, {align:"center"}); const tw=doc.getTextWidth(E.correo); doc.setDrawColor(...GTXT); doc.setLineWidth(0.25); doc.line(W/2-tw/2, fy+0.8, W/2+tw/2, fy+0.8); fy+=6.5; }
    if(E.telefono){ doc.setFontSize(14); doc.text(E.telefono, W/2, fy, {align:"center"}); }
  }
  // Encabezado: logo + título
  const lw=62, lh=lw*LOGO_RATIO;
  try{ doc.addImage(LOGO_PDF,"JPEG",M-2,y,lw,lh); }catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(22); doc.setTextColor(...GREEN);
  doc.text("COTIZACIÓN", W-M, y+12, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...INK);
  doc.text(`N° ${info.numero}`, W-M, y+19, {align:"right"});
  doc.text(info.fecha, W-M, y+24.5, {align:"right"});
  if(info.validaHasta){ doc.setFontSize(9.5); doc.setTextColor(...MUTED); doc.text(`Válida hasta el ${info.validaHasta}`, W-M, y+30, {align:"right"}); }
  y += lh + 6;
  doc.setDrawColor(...GREEN); doc.setLineWidth(0.8); doc.line(M, y, W-M, y); y += 8;

  // Datos de la empresa (arriba del cliente)
  doc.setTextColor(...INK);
  if(E.razon){ doc.setFont("helvetica","bold"); doc.setFontSize(11.5); doc.text(E.razon, M, y); y+=5.4; }
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
  [E.dir1,E.dir2].filter(Boolean).forEach(t=>{ doc.text(t, M, y); y+=5; });
  if(String(info.vendedor||"").trim()){ y+=1.5; doc.setFont("helvetica","bold"); doc.setTextColor(...MUTED); doc.text("Vendedor:", M, y);
    doc.setFont("helvetica","normal"); doc.setTextColor(...INK); doc.text(String(info.vendedor), M+24, y); y+=5; }
  y += 5;

  // Cliente
  const fila=(lbl,val)=>{ if(!String(val||"").trim()) return; doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...MUTED); doc.text(lbl, M, y);
    doc.setFont("helvetica","normal"); doc.setTextColor(...INK); doc.text(String(val), M+24, y); y+=6; };
  fila("Cliente:", info.cliente); fila("Teléfono:", info.contacto); fila("Correo:", info.correo);
  y += 3;

  // Producto y tabla
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...INK);
  doc.text(data.titulo, M, y); y += 6;
  doc.setFillColor(...GREEN); doc.rect(M, y, W-2*M, 9, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(255,255,255);
  doc.text("Descripción", M+4, y+6); doc.text("Valor", W-M-4, y+6, {align:"right"}); y += 9;
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
  data.lines.forEach((ln,i)=>{
    const x0 = M+4+(ln.ind?6:0);
    const txt = doc.splitTextToSize((ln.ind?"+ ":"")+ln.d, W-2*M-48-(ln.ind?6:0));
    const h = Math.max(8, txt.length*5+3);
    need(h);
    if(i%2===1){ doc.setFillColor(240,248,241); doc.rect(M, y, W-2*M, h, "F"); }
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(...(ln.ind?MUTED:INK));
    doc.text(txt, x0, y+5.5);
    doc.text(pdfMoney(ln.v), W-M-4, y+5.5, {align:"right"});
    y += h;
  });
  doc.setDrawColor(220,227,221); doc.setLineWidth(0.3); doc.line(M, y, W-M, y); y += 5;

  // Total
  need(22);
  doc.setFillColor(...GREEN); doc.roundedRect(W-M-80, y, 80, 16, 3, 3, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(255,255,255);
  doc.text("TOTAL", W-M-74, y+10.2);
  doc.setFontSize(16); doc.text(pdfMoney(data.total), W-M-5, y+10.8, {align:"right"});
  doc.setTextColor(...INK);
  y += 16 + 10;

  // Notas
  if(String(info.notas||"").trim()){
    need(14);
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...INK); doc.text("Notas", M, y); y+=5.5;
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...MUTED);
    const t=doc.splitTextToSize(info.notas, W-2*M); need(t.length*4.8); doc.text(t, M, y); y+=t.length*4.8+6;
  }

  // Puntos clave
  const puntos=[];
  if(data.cabina && E.captura) puntos.push(["Proceso de Captura:", E.captura]);
  if(data.cabina && E.reserva) puntos.push(["Reserva de Fecha:", E.reserva]);
  if(data.cabina && E.entrega) puntos.push(["Disponibilidad de Entrega:", E.entrega]);
  const vig = info.vigencia!=null ? info.vigencia : E.vigencia;
  if(String(vig||"").trim()) puntos.push(["Vigencia:", `Es importante mencionar que esta cotización y sus condiciones comerciales tienen una validez de ${vig} días a contar de hoy.`]);
  if(puntos.length){
    need(12);
    doc.setFont("helvetica","normal"); doc.setFontSize(11.5); doc.setTextColor(...INK);
    doc.text("Puntos clave para la coordinación", M, y); y+=8;
    const bx=M+4, tx=M+10, maxW=W-M-tx, LH=5;
    puntos.forEach(([tit,txt])=>{
      doc.setFontSize(10.5);
      doc.setFont("helvetica","bold"); const tw=doc.getTextWidth(tit+" ");
      doc.setFont("helvetica","normal");
      const words=txt.split(/\s+/); let first="", k=0;
      while(k<words.length){ const tryS=(first?first+" ":"")+words[k]; if(doc.getTextWidth(tryS) <= maxW-tw) { first=tryS; k++; } else break; }
      const rest = k<words.length ? doc.splitTextToSize(words.slice(k).join(" "), maxW) : [];
      const h=(1+rest.length)*LH+3;
      need(h);
      doc.setTextColor(...INK);
      doc.circle(bx, y-1.3, 0.9, "F");
      doc.setFont("helvetica","bold"); doc.text(tit, tx, y);
      doc.setFont("helvetica","normal"); doc.text(first, tx+tw, y);
      if(rest.length) doc.text(rest, tx, y+LH);
      y += h;
    });
  }
  footer();
  return doc.output("blob");
}
